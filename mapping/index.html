<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Đối chiếu BHXH</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-7xl mx-auto bg-white shadow-xl rounded-lg p-6">
        <h1 class="text-2xl font-bold text-blue-800 mb-2 border-b pb-2">LQT SureCheck</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="border-2 border-dashed border-blue-300 p-4 rounded bg-blue-50">
                <label class="block font-bold text-blue-800 mb-2">1. File Nhân viên (NV)</label>
                <input type="file" id="fileNV" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700"/>
            </div>
            <div class="border-2 border-dashed border-green-300 p-4 rounded bg-green-50">
                <label class="block font-bold text-green-800 mb-2">2. File Khoa phòng (KP)</label>
                <input type="file" id="fileKP" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-green-600 file:text-white hover:file:bg-green-700"/>
            </div>
        </div>

        <div class="flex gap-4">
            <button onclick="processData()" class="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded shadow transition duration-300">
                🚀 1. CHẠY KIỂM TRA
            </button>
            <button id="btnExport" onclick="exportResult()" class="hidden flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded shadow transition duration-300">
                📥 2. TẢI FILE EXCEL ĐÃ TÔ LỖI
            </button>
        </div>

        <div id="resultArea" class="mt-8 hidden">
            <h2 class="text-xl font-bold mb-4">Kết quả: <span id="errorCount" class="text-red-600"></span></h2>
            <div class="overflow-x-auto max-h-[500px] border border-gray-300 rounded">
                <table class="min-w-full bg-white text-sm">
                    <thead class="bg-gray-100 sticky top-0 shadow z-10">
                        <tr>
                            <th class="py-3 px-4 border text-left w-12">STT</th>
                            <th class="py-3 px-4 border text-left">Mã BHXH</th>
                            <th class="py-3 px-4 border text-left">Họ tên</th>
                            <th class="py-3 px-4 border text-left">Loại lỗi</th>
                            <th class="py-3 px-4 border text-left">Chi tiết lỗi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CẤU HÌNH TÊN CỘT
        const COL = {
            NV_MA_KHOA: "MA_KHOA",
            NV_TEN_KHOA: "TEN_KHOA",
            NV_MA_BHXH: "MA_BHXH",
            NV_HO_TEN: "HO_TEN",
            NV_PHAM_VI: "PHAMVI_CM",  
            NV_CDNN: "CHUCDANH_NN",   
            KP_MA_KHOA: "MA_KHOA",
            KP_TEN_KHOA: "TEN_KHOA"
        };

        // Biến toàn cục lưu Workbook để xuất file
        let globalWorkbookNV = null;
        let globalSheetNameNV = null;
        let globalHeaderMap = {}; // Map tên cột -> chỉ số cột (A, B, C...)

        function splitAndTrim(str) {
            if (!str) return [];
            return str.toString().split(';').map(item => item.trim()).filter(item => item !== "");
        }

        async function processData() {
            const fileNV = document.getElementById('fileNV').files[0];
            const fileKP = document.getElementById('fileKP').files[0];

            if (!fileNV || !fileKP) {
                alert("⚠️ Vui lòng chọn đủ cả 2 file!");
                return;
            }

            try {
                // 1. Load Rules & Data KP
                const response = await fetch('mapping_bhxh.json');
                const mappingRules = await response.json();
                const mapRulesDict = {};
                mappingRules.forEach(item => {
                    mapRulesDict[item.MA_PHAM_VI.toString().trim()] = item; 
                });

                // Đọc file KP (chỉ cần lấy data để tra cứu)
                const dataKP = await readExcelDataOnly(fileKP);
                const mapKhoaPhong = {};
                dataKP.forEach(row => {
                    if (row[COL.KP_MA_KHOA]) {
                        mapKhoaPhong[row[COL.KP_MA_KHOA].toString().trim()] = row[COL.KP_TEN_KHOA] || "";
                    }
                });

                // 2. Đọc file NV (Giữ lại Workbook để sửa style)
                await readNVWorkbook(fileNV);
                
                // Lấy data dạng JSON từ workbook đã load
                const worksheet = globalWorkbookNV.Sheets[globalSheetNameNV];
                const dataNV = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                // 3. Xử lý Đối chiếu & Tô màu
                let errors = [];
                let stt = 1;

                // Thêm cột ghi chú lỗi vào data nếu cần, nhưng ta sẽ ghi thẳng vào cell
                // Xác định cột cuối cùng để ghi chú
                const range = XLSX.utils.decode_range(worksheet['!ref']);
                const noteColIndex = range.e.c + 1; 
                
                // Ghi header cho cột Ghi chú
                const noteHeaderCell = XLSX.utils.encode_cell({r: 0, c: noteColIndex});
                worksheet[noteHeaderCell] = { v: "CHI_TIET_LOI_TOOL", t: 's', s: { font: { bold: true, color: { rgb: "FF0000" } } } };
                // Mở rộng vùng in
                range.e.c = noteColIndex;
                worksheet['!ref'] = XLSX.utils.encode_range(range);

                dataNV.forEach((nv, index) => {
                    const rowIndex = index + 1; // Row trong Excel (header là 0) -> Data bắt đầu từ dòng 1 (A2)
                    
                    const rawMaKhoa = nv[COL.NV_MA_KHOA] || "";
                    const rawTenKhoa = nv[COL.NV_TEN_KHOA] || "";
                    const maBHXH = nv[COL.NV_MA_BHXH] || "";
                    const hoTen = nv[COL.NV_HO_TEN] || "";
                    const rawPhamVi = nv[COL.NV_PHAM_VI] || "";
                    const rawChucDanh = nv[COL.NV_CDNN] ? nv[COL.NV_CDNN].toString().trim() : "";

                    let rowErrors = [];

                    // --- CHECK KHOA ---
                    const listMaKhoa = splitAndTrim(rawMaKhoa);
                    if (listMaKhoa.length > 0) {
                        let isKhoaError = false;
                        listMaKhoa.forEach(ma => {
                            if (!mapKhoaPhong.hasOwnProperty(ma)) {
                                isKhoaError = true;
                                rowErrors.push(`Mã khoa '${ma}' sai`);
                            } else if (listMaKhoa.length === 1) {
                                const tenKhoaGoc = mapKhoaPhong[ma];
                                if (rawTenKhoa && tenKhoaGoc && rawTenKhoa.toLowerCase().trim() !== tenKhoaGoc.toLowerCase().trim()) {
                                    rowErrors.push(`Tên khoa chưa chuẩn xác so với DM`);
                                    highlightCell(worksheet, rowIndex, COL.NV_TEN_KHOA, "FFFFCC"); // Vàng cảnh báo
                                }
                            }
                        });

                        if (isKhoaError) {
                            errors.push({stt: stt++, ma: maBHXH, ten: hoTen, loai: "Sai Mã Khoa", chitiet: rowErrors.join('; ')});
                            highlightCell(worksheet, rowIndex, COL.NV_MA_KHOA, "FFCCCC"); // Đỏ nhạt
                        }
                    }

                    // --- CHECK PHẠM VI & CHỨC DANH ---
                    const listPhamVi = splitAndTrim(rawPhamVi);
                    if (listPhamVi.length > 0) {
                        let isTitleValid = false;
                        let validScopeCount = 0;
                        let invalidScopes = [];

                        listPhamVi.forEach(pv => {
                            if (mapRulesDict.hasOwnProperty(pv)) {
                                validScopeCount++;
                                if (rawChucDanh === mapRulesDict[pv].MA_CHUC_DANH.toString().trim()) {
                                    isTitleValid = true;
                                }
                            } else {
                                invalidScopes.push(pv);
                            }
                        });

                        if (invalidScopes.length > 0) {
                            rowErrors.push(`Mã PV '${invalidScopes.join(',')}' không có trong DM`);
                            errors.push({stt: stt++, ma: maBHXH, ten: hoTen, loai: "Sai Phạm vi CM", chitiet: `Mã PV không tồn tại: ${invalidScopes.join(', ')}`});
                            highlightCell(worksheet, rowIndex, COL.NV_PHAM_VI, "FFCCCC");
                        }

                        if (validScopeCount > 0 && !isTitleValid) {
                            rowErrors.push(`Chức danh '${rawChucDanh}' không khớp với PVCM`);
                            errors.push({stt: stt++, ma: maBHXH, ten: hoTen, loai: "Sai Chức danh", chitiet: `Chức danh '${rawChucDanh}' không hợp lệ với các phạm vi đã khai`});
                            highlightCell(worksheet, rowIndex, COL.NV_CDNN, "FFCCCC");
                        }
                    }

                    // --- GHI CHÚ LỖI VÀO CỘT CUỐI CÙNG CỦA EXCEL ---
                    if (rowErrors.length > 0) {
                        const noteCell = XLSX.utils.encode_cell({r: rowIndex, c: noteColIndex});
                        worksheet[noteCell] = { v: rowErrors.join(" | "), t: 's' };
                    }
                });

                renderResult(errors);
                
                // Hiện nút Export
                document.getElementById('btnExport').classList.remove('hidden');

            } catch (e) {
                console.error(e);
                alert("❌ Lỗi xử lý: " + e.message);
            }
        }

        // Hàm tô màu ô
        function highlightCell(ws, r, colName, colorHex) {
            // Tìm index cột dựa trên tên header (đã map từ trước)
            const c = globalHeaderMap[colName];
            if (c === undefined) return;

            const cellAddress = XLSX.utils.encode_cell({r: r, c: c});
            
            if (!ws[cellAddress]) ws[cellAddress] = { v: "", t: "s" }; // Tạo ô nếu rỗng
            
            // Apply Style
            if (!ws[cellAddress].s) ws[cellAddress].s = {};
            ws[cellAddress].s.fill = { fgColor: { rgb: colorHex } };
        }

        // Đọc workbook NV và lưu toàn cục + Map Header
        function readNVWorkbook(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    globalWorkbookNV = XLSX.read(data, {type: 'array', cellStyles: true});
                    globalSheetNameNV = globalWorkbookNV.SheetNames[0];
                    
                    // Map Header
                    const ws = globalWorkbookNV.Sheets[globalSheetNameNV];
                    const range = XLSX.utils.decode_range(ws['!ref']);
                    globalHeaderMap = {};
                    
                    // Duyệt dòng 0 (header) để tìm vị trí cột
                    for(let C = range.s.c; C <= range.e.c; ++C) {
                        const cell = ws[XLSX.utils.encode_cell({r: 0, c: C})];
                        if(cell && cell.v) {
                            globalHeaderMap[cell.v.toString().trim()] = C;
                        }
                    }
                    resolve();
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // Đọc data thường cho file KP
        function readExcelDataOnly(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, {type: 'array'});
                    resolve(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function exportResult() {
            if (!globalWorkbookNV) return;
            // Xuất file
            XLSX.writeFile(globalWorkbookNV, "KetQua_DoiChieu_NV_ToMau.xlsx");
        }

        function renderResult(errors) {
            const resultArea = document.getElementById('resultArea');
            const tableBody = document.getElementById('tableBody');
            const errorCount = document.getElementById('errorCount');

            resultArea.classList.remove('hidden');
            tableBody.innerHTML = "";
            
            if (errors.length === 0) {
                errorCount.innerHTML = "✅ Không có lỗi!";
                errorCount.className = "text-green-600";
                return;
            }

            errorCount.innerHTML = `⚠️ ${errors.length} dòng lỗi (Xem chi tiết và tải Excel)`;
            errorCount.className = "text-red-600";

            errors.forEach(err => {
                const row = `
                    <tr class="hover:bg-blue-50 border-b transition">
                        <td class="py-2 px-4 text-center text-gray-500">${err.stt}</td>
                        <td class="py-2 px-4 font-semibold text-gray-700">${err.ma}</td>
                        <td class="py-2 px-4 text-blue-900 font-medium">${err.ten}</td>
                        <td class="py-2 px-4 font-bold text-red-600">${err.loai}</td>
                        <td class="py-2 px-4 text-sm text-gray-700">${err.chitiet}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }
    </script>
</body>
</html>
