<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Lấy Số Bệnh Viện</title>
    <style>
        /* --- CẤU HÌNH GIAO DIỆN CHUNG --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .screen-container {
            background: white;
            width: 95%; height: 95%;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
            position: relative;
        }

        /* --- PHẦN HEADER --- */
        .header-section {
            text-align: center; margin-top: 20px;
        }
        .hospital-logo { height: 100px; width: auto; margin-bottom: 10px; }
        .main-title {
            color: #0056b3; margin: 0; font-size: 36px;
            font-weight: 800; text-transform: uppercase;
        }
        .sub-title { margin: 5px 0; font-size: 20px; color: #555; }
        .number-display {
            font-size: 24px; color: #444; margin-top: 10px;
            background: #f1f3f5; padding: 10px 30px; border-radius: 50px;
            display: inline-block;
        }

        /* --- PHẦN NÚT BẤM (ĐÃ CHỈNH SỬA) --- */
        .action-section {
            flex-grow: 1; /* Chiếm phần không gian còn lại ở giữa */
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            width: 100%;
        }

        .btn-print {
            /* Màu sắc & Gradient */
            background: linear-gradient(to bottom, #007bff, #0062cc);
            color: white;
            border: none;
            
            /* Kích thước & Hình dáng: Gọn gàng hơn */
            padding: 30px 80px;
            border-radius: 60px; /* Bo tròn kiểu viên thuốc */
            
            /* Font chữ: Dễ đọc */
            font-family: 'Verdana', sans-serif;
            font-size: 42px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            
            /* Hiệu ứng 3D để dễ hình dung là nút */
            box-shadow: 0 8px 0 #004a99, 0 15px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.1s;
            
            /* Căn chỉnh icon và chữ */
            display: flex; flex-direction: column; align-items: center;
        }

        /* Hiệu ứng khi bấm xuống */
        .btn-print:active {
            transform: translateY(4px); /* Nút lún xuống */
            box-shadow: 0 4px 0 #004a99, 0 5px 10px rgba(0,0,0,0.2);
        }

        .btn-icon { font-size: 50px; margin-bottom: 5px; }
        
        .note-text {
            margin-top: 25px; font-size: 18px; color: #888; font-style: italic;
        }

        /* --- NÚT RESET --- */
        .btn-reset {
            position: absolute; bottom: 15px; right: 15px;
            background: none; border: 1px solid #eee; color: #ccc;
            padding: 8px 12px; border-radius: 5px; cursor: pointer;
        }
        .btn-reset:hover { border-color: red; color: red; }

        /* --- MẪU IN (GIỮ NGUYÊN) --- */
        #print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            .screen-container { display: none; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                display: block; position: absolute; top: 0; left: 0; width: 100%;
                text-align: center; color: black;
            }
            .hospital-name-print { font-family: "Times New Roman", serif; font-size: 16px; font-weight: bold; text-transform: uppercase; margin: 5px 0; }
            .service-name-print { font-family: "Times New Roman", serif; font-size: 20px; font-weight: bold; margin-bottom: 5px; }
            .ticket-number-print { font-family: Arial, sans-serif; font-size: 100px; font-weight: 900; line-height: 1; margin: 5px 0; }
            .print-time-print { font-family: "Times New Roman", serif; font-size: 12px; margin-top: 5px; margin-bottom: 20px; }
            @page { margin: 0; size: auto; }
        }
    </style>
</head>
<body>
    <div class="screen-container">
        <div class="header-section">
            <img src="/img/logopng-removebg-preview.png" 
                 onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%230056b3\' stroke-width=\'2\'><path d=\'M22 12h-4l-3 9L9 3l-3 9H2\'></path></svg>'"
                 alt="Logo" class="hospital-logo">
            <h1 class="main-title">BỆNH VIỆN PHỤC HỒI CHỨC NĂNG</h1>
            <h2 class="sub-title">Hệ thống lấy số tự động</h2>
            <div class="number-display">Số đang gọi: <strong id="screen-number" style="color:#dc3545">---</strong></div>
        </div>
        
        <div class="action-section">
            <button class="btn-print" onclick="processPrint()">
                <span class="btn-icon">🖨️</span>
                BẤM ĐỂ LẤY SỐ
            </button>
            <p class="note-text">Vui lòng chờ lấy phiếu tại máy in</p>
        </div>

        <button class="btn-reset" onclick="manualReset()">⚙️ Reset</button>
    </div>

    <div id="print-area">
        <div class="hospital-name-print">BV PHCN ĐỒNG THÁP</div>
        <div class="service-name-print">Khám bệnh</div>
        <div class="ticket-number-print" id="ticket-num">00</div>
        <div class="print-time-print" id="ticket-time">...</div>
    </div>

    <script>
        const KEY_DATE = 'last_print_date_v2';
        const KEY_COUNT = 'current_count_v2';

        function getToday() { return new Date().toLocaleDateString('vi-VN'); }

        function getNextNumber() {
            const today = getToday();
            const lastDate = localStorage.getItem(KEY_DATE);
            let count = parseInt(localStorage.getItem(KEY_COUNT) || '0');
            if (lastDate !== today) { count = 0; localStorage.setItem(KEY_DATE, today); }
            count++;
            localStorage.setItem(KEY_COUNT, count);
            return count;
        }

        function getFormattedDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB'); 
            const timeStr = now.toLocaleTimeString('en-US', { hour12: true, hour: 'numeric', minute: 'numeric', second: 'numeric' });
            return `Ngày in: ${dateStr} ${timeStr}`;
        }

        function updateScreen() {
            const current = localStorage.getItem(KEY_COUNT) || 0;
            document.getElementById('screen-number').innerText = current > 0 ? current : '--';
        }

        function processPrint() {
            const newNum = getNextNumber();
            document.getElementById('ticket-num').innerText = newNum;
            document.getElementById('ticket-time').innerText = getFormattedDateTime();
            updateScreen();
            setTimeout(function() { window.print(); }, 150);
        }

        function manualReset() {
            if (confirm("⚠️ CẢNH BÁO: Đặt lại số thứ tự về 0?")) {
                localStorage.setItem(KEY_COUNT, 0); updateScreen();
            }
        }
        updateScreen();
    </script>
</body>
</html>
