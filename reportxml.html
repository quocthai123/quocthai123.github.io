    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const appendFileInput = document.getElementById('appendFileInput');
        
        window.debugScanLog = [];
        // Bộ lọc thông minh: Bắt đuôi file, MIME type, hoặc đọc thử nội dung bên trong
        const isXmlFile = async (file) => {
            if (!file) return false;
            const name = file.name.toLowerCase();
            const type = file.type ? file.type.toLowerCase() : "";
            
            if (name.endsWith('.xml') || type.includes('xml')) {
                return true;
            }
            
            // Nếu không có đuôi file và hệ điều hành không nhận diện được, đọc 100 byte đầu tiên
            try {
                const chunk = file.slice(0, 100);
                const text = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.onerror = () => resolve("");
                    reader.readAsText(chunk);
                });
                
                const content = text.trim();
                if (content.startsWith('<?xml') || content.startsWith('<')) {
                    return true;
                }
            } catch (e) {}
            
            return false;
        };
        const loadingSection = document.getElementById('loadingSection');
        const dataSection = document.getElementById('dataSection');
        const uploadSection = document.getElementById('uploadSection');
        const tabList = document.getElementById('myTab');
        const tabContent = document.getElementById('myTabContent');
        const fileNameDisplay = document.getElementById('fileNameDisplay');

        // Map tên hiển thị các loại hồ sơ
        const mapLoai = {
            'XML1': 'Tổng Hợp (XML1)',
            'XML2': 'Chi Tiết Thuốc (XML2)',
            'XML3': 'Dịch Vụ KT (XML3)',
            'XML4': 'Cận Lâm Sàng (XML4)',
            'XML5': 'Diễn Biến Bệnh (XML5)'
        };

        function resetApp() {
            fileInput.value = '';
            uploadSection.style.display = 'block';
            dataSection.style.display = 'none';
            loadingSection.style.display = 'none';
            tabList.innerHTML = '';
            tabContent.innerHTML = '';
        }

        // Click to upload
        dropZone.addEventListener('click', () => fileInput.click());

        // Drag and drop events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            if (e.dataTransfer.items) {
                window.debugScanLog = [];
                // Hỗ trợ kéo thả cả thư mục
                uploadSection.style.display = 'none';
                loadingSection.style.display = 'block';
                document.getElementById('loadingTitle').innerText = "Đang quét các thư mục...";
                document.getElementById('progressContainer').style.display = 'none';
                document.getElementById('progressCount').style.display = 'block';
                document.getElementById('progressCount').innerText = "Đang tìm file XML... 0";
                
                let foundCount = 0;
                const onFileFound = () => {
                    foundCount++;
                    if (foundCount % 5 === 0) {
                        document.getElementById('progressCount').innerText = `Đã tìm thấy ${foundCount} file XML...`;
                    }
                };
                
                const files = await getFilesFromDataTransfer(e.dataTransfer, onFileFound);
                
                if (files.length) {
                    document.getElementById('progressCount').innerText = `Đã tìm thấy tổng cộng ${files.length} file XML. Đang chuẩn bị đọc...`;
                    processFiles(files, false);
                } else {
                    let isFolderBlocked = window.debugScanLog.some(log => log.includes("DirReader Error"));
                    let msg = "Không tìm thấy file hợp lệ nào.\n\n";
                    if (isFolderBlocked) {
                        msg += "❌ LỖI BẢO MẬT TỪ PHẦN MỀM: Hệ thống của bạn (WebView2/C#) đang chặn không cho web tự động đọc bên trong thư mục!\n\n";
                        msg += "👉 CÁCH KHẮC PHỤC DÀNH CHO BẠN:\n";
                        msg += "1. KHÔNG KÉO THẢ THƯ MỤC NỮA.\n";
                        msg += "2. Mở thư mục đó ra, bấm Ctrl + A để bôi đen tất cả các file bên trong.\n";
                        msg += "3. Kéo thả CÁC FILE đó vào web, HOẶC nhấn nút 'Thêm File' rồi chọn tất cả file.\n";
                    } else {
                        msg += "Chi tiết kỹ thuật:\n" + window.debugScanLog.join('\n');
                    }
                    alert(msg);
                    uploadSection.style.display = 'block';
                    loadingSection.style.display = 'none';
                }
            } else if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                processFiles(fileInput.files, false);
            }
        });

        // Hàm đệ quy đọc folder từ Drag & Drop
        async function getFilesFromDataTransfer(dataTransfer, onFileFound) {
            let files = [];
            for (let i = 0; i < dataTransfer.items.length; i++) {
                let item = dataTransfer.items[i];
                if (item.kind === 'file') {
                    let entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
                    if (entry) {
                        if (window.debugScanLog.length < 5) window.debugScanLog.push("DataTransfer Entry: " + entry.name + (entry.isDirectory ? " (DIR)" : " (FILE)"));
                        await traverseFileTree(entry, files, onFileFound);
                    } else {
                        if (window.debugScanLog.length < 5) window.debugScanLog.push("DataTransfer Item: No webkitGetAsEntry");
                        let file = item.getAsFile();
                        if (await isXmlFile(file)) {
                            if (onFileFound) onFileFound();
                            files.push(file);
                        }
                    }
                }
            }
            return files;
        }

        async function traverseFileTree(item, files, onFileFound) {
            if (item.isFile) {
                return new Promise(resolve => {
                    item.file(async file => {
                        if (await isXmlFile(file)) {
                            if (onFileFound) onFileFound();
                            files.push(file);
                        }
                        resolve();
                    }, err => {
                        console.error("Lỗi đọc file:", err);
                        resolve();
                    });
                });
            } else if (item.isDirectory) {
                let dirReader = item.createReader();
                let entries = [];
                
                const readAllEntries = () => {
                    return new Promise(resolve => {
                        const readNext = () => {
                            dirReader.readEntries(results => {
                                if (window.debugScanLog.length < 8) window.debugScanLog.push("DirReader read: " + results.length + " items");
                                if (results.length) {
                                    entries = entries.concat(results);
                                    readNext();
                                } else {
                                    resolve();
                                }
                            }, err => {
                                let errDetail = err ? (err.message || err.name || String(err)) : "Unknown Error";
                                if (window.debugScanLog.length < 8) window.debugScanLog.push("DirReader Error: " + errDetail);
                                resolve();
                            });
                        };
                        readNext();
                    });
                };
                await readAllEntries();
                
                for (let i = 0; i < entries.length; i++) {
                    await traverseFileTree(entries[i], files, onFileFound);
                    // Nhường luồng cho UI sau mỗi 50 file/folder để tránh đơ trình duyệt
                    if (i % 50 === 0) await new Promise(r => setTimeout(r, 0));
                }
            }
        }

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e);
                reader.readAsText(file);
            });
        }

        function decodeBase64(str) {
            try {
                const bin = window.atob(str);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                return null;
            }
        }

        function getRecords(node) {
            let hasElementChild = false;
            let allChildrenAreLeaves = true;
            
            for (let i = 0; i < node.childNodes.length; i++) {
                const child = node.childNodes[i];
                if (child.nodeType === 1) { // ELEMENT_NODE
                    hasElementChild = true;
                    for (let j = 0; j < child.childNodes.length; j++) {
                        if (child.childNodes[j].nodeType === 1) {
                            allChildrenAreLeaves = false;
                            break;
                        }
                    }
                }
            }
            
            if (hasElementChild && allChildrenAreLeaves) {
                return [node];
            } else if (hasElementChild && !allChildrenAreLeaves) {
                let records = [];
                for (let i = 0; i < node.childNodes.length; i++) {
                    if (node.childNodes[i].nodeType === 1) {
                        records = records.concat(getRecords(node.childNodes[i]));
                    }
                }
                return records;
            }
            return [];
        }

        function parseXMLToStore(xmlString, dataStore) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, "text/xml");
            
            // Check for parsing errors
            const parseError = xmlDoc.getElementsByTagName("parsererror");
            if (parseError.length > 0) {
                throw new Error("Lỗi cấu trúc XML (Parser Error)");
            }

            const fileHosos = xmlDoc.getElementsByTagName("FILEHOSO");
            
            for (let i = 0; i < fileHosos.length; i++) {
                const loaiHosoNode = fileHosos[i].getElementsByTagName("LOAIHOSO")[0];
                if (!loaiHosoNode) continue;
                const loai = loaiHosoNode.textContent.trim(); 
                
                const noiDungNode = fileHosos[i].getElementsByTagName("NOIDUNGFILE")[0];
                if (!noiDungNode) continue;
                
                let rootNode = null;
                let hasElement = false;
                for (let j = 0; j < noiDungNode.childNodes.length; j++) {
                    if (noiDungNode.childNodes[j].nodeType === 1) { // ELEMENT_NODE
                        rootNode = noiDungNode.childNodes[j];
                        hasElement = true;
                        break;
                    }
                }
                
                if (!hasElement) {
                    const textContent = noiDungNode.textContent.trim();
                    if (textContent) {
                        const decodedText = decodeBase64(textContent);
                        if (decodedText) {
                            const subDoc = parser.parseFromString(decodedText, "text/xml");
                            if (subDoc.getElementsByTagName("parsererror").length === 0) {
                                for (let j = 0; j < subDoc.childNodes.length; j++) {
                                    if (subDoc.childNodes[j].nodeType === 1) {
                                        rootNode = subDoc.childNodes[j];
                                        break;
                                    }
                                }
                            }
                        }
                    }
                }
                
                if (!rootNode) continue;
                
                if (!dataStore[loai]) {
                    dataStore[loai] = { 
                        id: loai, 
                        name: mapLoai[loai] || loai, 
                        rows: [], 
                        cols: new Set() 
                    };
                }

                let records = getRecords(rootNode);
                
                records.forEach(recordNode => {
                    let rowData = {};
                    for (let j = 0; j < recordNode.childNodes.length; j++) {
                        const field = recordNode.childNodes[j];
                        if (field.nodeType === 1) {
                            const colName = field.nodeName;
                            const colValue = field.textContent;
                            rowData[colName] = colValue;
                            dataStore[loai].cols.add(colName);
                        }
                    }
                    dataStore[loai].rows.push(rowData);
                });
            }
        }

        async function exportChiPhi(e) {
            const btn = document.getElementById('btnExportChiPhi');

            if (window.cachedWbChiPhiUrl) {
                setTimeout(() => {
                    URL.revokeObjectURL(window.cachedWbChiPhiUrl);
                    window.cachedWbChiPhiUrl = null;
                    if (btn) {
                        btn.href = "javascript:void(0)";
                        btn.removeAttribute("download");
                        btn.style.color = '#333';
                        document.getElementById('lblExportChiPhi').innerText = "C79a-HD";
                    }
                }, 500);
                return;
            }
            if (e) e.preventDefault();

            if (!window.currentDataStore) {
                alert("Không có dữ liệu để xuất.");
                return;
            }

            if (btn) {
                btn.classList.add('disabled');
                document.getElementById('lblExportChiPhi').innerText = "Đang xử lý...";
            }
            await new Promise(r => setTimeout(r, 50));

            try {
                const dataStore = window.currentDataStore;
                const dt1 = dataStore['XML1'] ? dataStore['XML1'].rows : [];
                const dt3 = dataStore['XML3'] ? dataStore['XML3'].rows : [];

                if (dt1.length === 0) {
                    alert("Không có dữ liệu XML1 (Tổng Hợp) để xuất báo cáo chi phí.");
                    return;
                }

            // 2. XỬ LÝ NHÓM DỮ LIỆU DT3 TRƯỚC
            const dt3Grouped = {};
            dt3.forEach(row => {
                const maLk = String(row['MA_LK'] || '').trim();
                if (!dt3Grouped[maLk]) {
                    dt3Grouped[maLk] = [];
                }
                dt3Grouped[maLk].push(row);
            });

            function getDec(val) {
                if (!val) return 0;
                const parsed = parseFloat(val);
                return isNaN(parsed) ? 0 : parsed;
            }

            function sumTheoNhom(chiTiet, maNhomArr) {
                return chiTiet
                    .filter(r => maNhomArr.includes(String(r['MA_NHOM'])))
                    .reduce((sum, r) => sum + getDec(r['THANH_TIEN_BH'] || r['T_BHTT'] || r['THANH_TIEN']), 0);
            }

            // 3. ĐỔ DỮ LIỆU TỪ DT1 VÀ TÍNH TOÁN TỪ DT3
            let stt = 1;
            const exportData = [];

            dt1.forEach(r1 => {
                const maLk = String(r1['MA_LK'] || '').trim();
                const chiTiet = dt3Grouped[maLk] || [];

                // --- CÁC HÀM TÍNH TỔNG (SUM) DỰA THEO MA_NHOM ---
                const sumXetNghiem = sumTheoNhom(chiTiet, ["1"]);
                const sumCdha = sumTheoNhom(chiTiet, ["2", "3"]);
                const sumMau = sumTheoNhom(chiTiet, ["7", "17"]);
                const sumPttt = sumTheoNhom(chiTiet, ["8", "18"]);
                const sumKham = sumTheoNhom(chiTiet, ["13"]);

                exportData.push({
                    "STT": stt++,
                    "HO_TEN": r1["HO_TEN"] || '',
                    "NGAY_SINH": r1["NGAY_SINH"] || '',
                    "GIOI_TINH": r1["GIOI_TINH"] || '',
                    "MA_THE_BHYT": r1["MA_THE_BHYT"] || '',
                    "MA_DKBD": r1["MA_DKBD"] || '',
                    "MA_LOAI_KCB": r1["MA_LOAI_KCB"] || '',
                    "MA_BENH_CHINH": r1["MA_BENH_CHINH"] || '',
                    "NGAY_KHAM": r1["NGAY_VAO"] || '',
                    "TONG_TIEN_BV": getDec(r1["T_TONGCHI_BV"]),
                    "TONG_TIEN_BH": getDec(r1["T_TONGCHI_BH"]),
                    "XET_NGHIEM": sumXetNghiem,
                    "CĐHA_TDCN": sumCdha,
                    "T_THUOC": getDec(r1["T_THUOC"]),
                    "T_MAU": sumMau,
                    "T_PTTT": sumPttt,
                    "T_VTYT": getDec(r1["T_VTYT"]),
                    "T_CONGKHAM": sumKham,
                    "T_BHTT": getDec(r1["T_BHTT"])
                });
            });

            const ws = XLSX.utils.json_to_sheet(exportData);
            
            // Format tiêu đề và tiền tệ: JS excel (SheetJS)
            // Thêm format tiền tệ (cột J đến S - tức cột số 9 đến 18 trong array index 0-based)
            const range = XLSX.utils.decode_range(ws['!ref']);
            for(let R = range.s.r + 1; R <= range.e.r; ++R) {
                for(let C = 9; C <= 18; ++C) {
                    const cellRef = XLSX.utils.encode_cell({r: R, c: C});
                    if(!ws[cellRef]) continue;
                    ws[cellRef].z = '#,##0';
                }
            }

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "BaoCao_ChiPhi");
            
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/octet-stream' });
            window.cachedWbChiPhiUrl = URL.createObjectURL(blob);

            } finally {
                if (btn) {
                    btn.classList.remove('disabled');
                    if (window.cachedWbChiPhiUrl) {
                        btn.href = window.cachedWbChiPhiUrl;
                        btn.download = "BaoCao_ChiPhi.xlsx";
                        btn.style.color = '#ff9800';
                        document.getElementById('lblExportChiPhi').innerText = "Hoàn tất! Tải Về";
                    } else {
                        btn.href = "javascript:void(0)";
                        btn.removeAttribute("download");
                        document.getElementById('lblExportChiPhi').innerText = "C79a-HD";
                    }
                }
            }
        }

                ];

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "ThongKe_BenhChinh");
                
                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });

        // ==========================================
        // MODULE CHẤM CÔNG (HÀNH CHÍNH & NGOÀI GIỜ)

        window.nhanVienMap = {};
        window.nhanVienList = [];

        function normalizeCchn(s) {
            if (!s) return '';
            return String(s).toUpperCase().replace(/\s+/g, '').trim();
        }

        function normalizeHeader(s) {
            if (!s) return '';
            return String(s)
                .toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
        }

        function handleDmNhanVien(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const sheetName = wb.SheetNames[0];
                    const ws = wb.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

                    if (!rows || rows.length === 0) {
                        alert("File danh mục không có dữ liệu.");
                        return;
                    }

                    // Tìm dòng tiêu đề
                    let headerRowIdx = -1;
                    for (let r = 0; r < Math.min(rows.length, 12); r++) {
                        const row = rows[r];
                        if (!row || !Array.isArray(row)) continue;
                        for (let c = 0; c < row.length; c++) {
                            const nh = normalizeHeader(row[c]);
                            if (nh === 'macchn' || nh === 'cchn' || nh === 'gphn' || nh.includes('cchn') || nh.includes('gphn') || nh.includes('mabacsi') || nh.includes('chungchi') || nh.includes('giayphep')) {
                                headerRowIdx = r;
                                break;
                            }
                        }
                        if (headerRowIdx !== -1) break;
                    }

                    if (headerRowIdx === -1) headerRowIdx = 0;

                    const headerRow = rows[headerRowIdx] || [];
                    let colCchn = -1;
                    let colTen = -1;
                    let colChucVu = -1;

                    // Pass 1: Tìm kiếm chính xác / ưu tiên cao
                    for (let c = 0; c < headerRow.length; c++) {
                        const nh = normalizeHeader(headerRow[c]);
                        if (colCchn === -1 && (nh === 'macchn' || nh === 'cchn' || nh === 'gphn' || nh === 'socchn' || nh === 'sogphn' || nh === 'socchnsogphn' || nh === 'mabs' || nh === 'mabacsi')) {
                            colCchn = c;
                        }
                        if (colTen === -1 && (nh === 'hoten' || nh === 'hovaten' || nh === 'tennhanvien' || nh === 'tennv' || nh === 'nhanvien' || nh === 'bacsi' || nh === 'tenbacsi')) {
                            colTen = c;
                        }
                        if (colChucVu === -1 && (nh === 'chucvu' || nh === 'chucdanh' || nh === 'bophan' || nh === 'chucvubophan' || nh === 'khoaphong' || nh === 'khoa')) {
                            colChucVu = c;
                        }
                    }

                    // Pass 2: Tìm kiếm gần đúng (nếu chưa tìm thấy ở Pass 1)
                    for (let c = 0; c < headerRow.length; c++) {
                        const nh = normalizeHeader(headerRow[c]);
                        if (colCchn === -1 && (nh.includes('cchn') || nh.includes('gphn') || nh.includes('chungchi') || nh.includes('giayphep'))) {
                            colCchn = c;
                        }
                        if (colTen === -1 && (nh.includes('hoten') || nh.includes('hovaten') || nh.includes('nhanvien') || (nh.includes('ten') && !nh.includes('khoa') && !nh.includes('phong') && !nh.includes('bophan') && !nh.includes('dichvu') && !nh.includes('thuoc') && !nh.includes('vtyt') && !nh.includes('donvi')))) {
                            if (c !== colCchn) colTen = c;
                        }
                        if (colChucVu === -1 && (nh.includes('chucvu') || nh.includes('bophan') || nh.includes('chucdanh') || nh.includes('khoaphong') || nh.includes('khoa') || nh.includes('vitri'))) {
                            if (c !== colCchn && c !== colTen) colChucVu = c;
                        }
                    }

                    const nvMap = {};
                    const nvList = [];

                    for (let r = headerRowIdx + 1; r < rows.length; r++) {
                        const row = rows[r];
                        if (!row || !Array.isArray(row)) continue;
                        const cchnRaw = colCchn !== -1 ? String(row[colCchn] || '').trim() : '';
                        const hoTen = colTen !== -1 ? String(row[colTen] || '').trim() : '';
                        const chucVu = colChucVu !== -1 ? String(row[colChucVu] || '').trim() : '';

                        if (!cchnRaw && !hoTen) continue;
                        if (cchnRaw.toLowerCase().includes('nghỉ') || hoTen.toLowerCase().includes('người lập') || hoTen.toLowerCase().includes('giám đốc') || hoTen.toLowerCase().includes('kế toán')) continue;

                        const normKey = normalizeCchn(cchnRaw);
                        const item = {
                            cchn: cchnRaw,
                            hoTen: hoTen,
                            chucVu: chucVu,
                            normKey: normKey
                        };
                        if (normKey) {
                            nvMap[normKey] = item;
                        }
                        nvList.push(item);
                    }

                    window.nhanVienMap = nvMap;
                    window.nhanVienList = nvList;

                    const lbl = document.getElementById('lblImportNhanVien');
                    if (lbl) {
                        lbl.innerText = `DM: ${nvList.length} NV`;
                    }
                    const btn = document.getElementById('btnImportNhanVien');
                    if (btn) {
                        btn.style.color = '#28a745';
                    }

                    alert(`Tải danh mục thành công! Nhận diện được ${nvList.length} nhân viên (Tìm theo MACCHN).`);
                } catch (err) {
                    console.error("Lỗi đọc danh mục nhân viên:", err);
                    alert("Lỗi khi đọc file danh mục: " + err.message);
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function parseXmlDate(str) {
            if (!str) return null;
            const s = String(str).trim();
            if (!s) return null;
            const numOnly = s.replace(/\D/g, '');
            if (numOnly.length >= 8) {
                const y = parseInt(numOnly.substr(0, 4), 10);
                const m = parseInt(numOnly.substr(4, 2), 10) - 1;
                const d = parseInt(numOnly.substr(6, 2), 10);
                const hh = numOnly.length >= 10 ? parseInt(numOnly.substr(8, 2), 10) : 0;
                const mm = numOnly.length >= 12 ? parseInt(numOnly.substr(10, 2), 10) : 0;
                const ss = numOnly.length >= 14 ? parseInt(numOnly.substr(12, 2), 10) : 0;
                const dt = new Date(y, m, d, hh, mm, ss);
                return isNaN(dt.getTime()) ? null : dt;
            }
            const dt = new Date(s);
            return isNaN(dt.getTime()) ? null : dt;
        }

        function getChamCongDataByMonth() {
            const dataStore = window.currentDataStore;
            if (!dataStore) {
                alert("Chưa có dữ liệu XML nào được tải vào.");
                return null;
            }

            const dt2 = dataStore['XML2'] ? dataStore['XML2'].rows : [];
            const dt3 = dataStore['XML3'] ? dataStore['XML3'].rows : [];

            if (dt2.length === 0 && dt3.length === 0) {
                alert("Không tìm thấy dữ liệu XML2 (Thuốc) hoặc XML3 (DVKT/VTYT) để tổng hợp chấm công.");
                return null;
            }

            const events = [];

            // 1. XML2: MA_BAC_SI với NGAY_YL
            dt2.forEach(r => {
                const bs = r['MA_BAC_SI'] ? String(r['MA_BAC_SI']).trim() : '';
                const yl = parseXmlDate(r['NGAY_YL']);
                if (bs && yl) {
                    events.push({ cchn: bs, date: yl });
                }
            });

            // 2. XML3: MA_BAC_SI với NGAY_YL, NGUOI_THUC_HIEN với NGAY_TH_YL
            dt3.forEach(r => {
                const bs = r['MA_BAC_SI'] ? String(r['MA_BAC_SI']).trim() : '';
                const yl = parseXmlDate(r['NGAY_YL']);
                if (bs && yl) {
                    events.push({ cchn: bs, date: yl });
                }

                const th = r['NGUOI_THUC_HIEN'] ? String(r['NGUOI_THUC_HIEN']).trim() : '';
                const thYl = parseXmlDate(r['NGAY_TH_YL']);
                if (th && thYl) {
                    const splitted = th.split(';');
                    splitted.forEach(item => {
                        const m = item.trim();
                        if (m) {
                            events.push({ cchn: m, date: thYl });
                        }
                    });
                }
            });

            if (events.length === 0) {
                alert("Không tìm thấy mốc y lệnh / thực hiện y lệnh nào hợp lệ trong XML2 và XML3.");
                return null;
            }

            // Nhóm theo Năm - Tháng (YYYY-MM)
            const monthsMap = {};
            events.forEach(ev => {
                const y = ev.date.getFullYear();
                const m = ev.date.getMonth() + 1;
                const mKey = `${y}-${String(m).padStart(2, '0')}`;
                if (!monthsMap[mKey]) {
                    monthsMap[mKey] = {
                        year: y,
                        month: m,
                        eventsByEmp: {}
                    };
                }
                const norm = normalizeCchn(ev.cchn);
                if (!monthsMap[mKey].eventsByEmp[norm]) {
                    monthsMap[mKey].eventsByEmp[norm] = {
                        rawCchn: ev.cchn,
                        events: []
                    };
                }
                monthsMap[mKey].eventsByEmp[norm].events.push(ev);
            });

            // Xử lý chi tiết theo từng tháng
            const resultMonths = {};
            const catalogList = window.nhanVienList || [];

            for (const mKey of Object.keys(monthsMap).sort()) {
                const mData = monthsMap[mKey];
                const year = mData.year;
                const month = mData.month;
                const daysInMonth = new Date(year, month, 0).getDate();

                // Xác định danh sách nhân viên: CHỈ lấy những nhân viên THỰC TẾ CÓ TRONG XML của tháng này
                let empList = [];
                const addedNorms = new Set();
                const xmlNormKeys = Object.keys(mData.eventsByEmp);

                if (catalogList.length > 0) {
                    // Nếu đã tải danh mục: lọc các nhân viên có trong XML và xếp theo thứ tự danh mục trước
                    catalogList.forEach(item => {
                        if (mData.eventsByEmp[item.normKey]) {
                            empList.push({
                                cchn: item.cchn || mData.eventsByEmp[item.normKey].rawCchn,
                                hoTen: item.hoTen,
                                chucVu: item.chucVu,
                                normKey: item.normKey
                            });
                            addedNorms.add(item.normKey);
                        }
                    });
                    // Thêm các nhân viên có trong XML nhưng chưa có trong danh mục (họ tên, chức vụ để rỗng)
                    for (const norm of xmlNormKeys.sort()) {
                        if (!addedNorms.has(norm)) {
                            empList.push({
                                cchn: mData.eventsByEmp[norm].rawCchn,
                                hoTen: '',
                                chucVu: '',
                                normKey: norm
                            });
                            addedNorms.add(norm);
                        }
                    }
                } else {
                    // Chưa tải danh mục: chỉ lấy những nhân viên có trong XML (tên & chức vụ rỗng)
                    for (const norm of xmlNormKeys.sort()) {
                        empList.push({
                            cchn: mData.eventsByEmp[norm].rawCchn,
                            hoTen: '',
                            chucVu: '',
                            normKey: norm
                        });
                    }
                }

                // Tính toán công cho từng nhân viên và từng ngày
                const employeesCalculated = empList.map(emp => {
                    const empEventsObj = mData.eventsByEmp[emp.normKey];
                    const empEvents = empEventsObj ? empEventsObj.events : [];

                    // Gom sự kiện theo ngày
                    const daysEvents = {};
                    empEvents.forEach(ev => {
                        const d = ev.date.getDate();
                        if (!daysEvents[d]) daysEvents[d] = [];
                        daysEvents[d].push(ev.date);
                    });

                    const days = {};
                    let totalOvertimeMins = 0;
                    let cntX = 0;
                    let cntX2 = 0;
                    let cntX3 = 0;

                    for (let d = 1; d <= daysInMonth; d++) {
                        const dList = daysEvents[d] || [];
                        let adminSym = '';
                        let truaTimeStr = '';
                        let toiTimeStr = '';
                        let truaFraction = null;
                        let toiFraction = null;

                        if (dList.length > 0) {
                            // Chấm công hành chính
                            const hasMorning = dList.some(dt => dt.getHours() < 12 || (dt.getHours() === 12 && dt.getMinutes() <= 30));
                            const hasAfternoon = dList.some(dt => dt.getHours() > 12 || (dt.getHours() === 12 && dt.getMinutes() > 30));

                            if (hasMorning && hasAfternoon) {
                                adminSym = 'x';
                                cntX++;
                            } else if (hasMorning) {
                                adminSym = 'x\\2';
                                cntX2++;
                            } else if (hasAfternoon) {
                                adminSym = 'x/2';
                                cntX3++;
                            }

                            // Chấm công ngoài giờ
                            // Ca trưa: > 11:30 và <= 13:30
                            const truaList = dList.filter(dt => {
                                const totalM = dt.getHours() * 60 + dt.getMinutes();
                                return totalM > (11 * 60 + 30) && totalM <= (13 * 60 + 30);
                            });
                            if (truaList.length > 0) {
                                const maxTrua = new Date(Math.max(...truaList.map(dt => dt.getTime())));
                                const h = maxTrua.getHours();
                                const m = maxTrua.getMinutes();
                                const s = maxTrua.getSeconds();
                                truaTimeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                                truaFraction = (h * 3600 + m * 60 + s) / 86400;
                                totalOvertimeMins += (h * 60 + m) - (11 * 60 + 30);
                            }

                            // Ca tối: > 17:00
                            const toiList = dList.filter(dt => {
                                const totalM = dt.getHours() * 60 + dt.getMinutes();
                                return totalM > (17 * 60);
                            });
                            if (toiList.length > 0) {
                                const maxToi = new Date(Math.max(...toiList.map(dt => dt.getTime())));
                                const h = maxToi.getHours();
                                const m = maxToi.getMinutes();
                                const s = maxToi.getSeconds();
                                toiTimeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                                toiFraction = (h * 3600 + m * 60 + s) / 86400;
                                totalOvertimeMins += (h * 60 + m) - (17 * 60);
                            }
                        }

                        days[d] = {
                            adminSym,
                            truaTimeStr,
                            toiTimeStr,
                            truaFraction,
                            toiFraction
                        };
                    }

                    return {
                        cchn: emp.cchn,
                        hoTen: emp.hoTen,
                        chucVu: emp.chucVu,
                        days,
                        cntX,
                        cntX2,
                        cntX3,
                        totalWorkingDays: cntX * 1 + cntX2 * 0.5 + cntX3 * 0.5,
                        totalOvertimeMins
                    };
                });

                resultMonths[mKey] = {
                    year,
                    month,
                    daysInMonth,
                    employees: employeesCalculated
                };
            }

            return resultMonths;
        }

        function setSheetCell(ws, r, c, val, type, formula, numFmt, formattedText) {
            const cellRef = XLSX.utils.encode_cell({ r: r, c: c });
            const cell = {};
            if (formula) cell.f = formula;
            if (val !== undefined && val !== null) cell.v = val;
            if (type) cell.t = type;
            else if (typeof val === 'number') cell.t = 'n';
            else if (typeof val === 'boolean') cell.t = 'b';
            else cell.t = 's';
            if (numFmt) cell.z = numFmt;
            if (formattedText) cell.w = formattedText;
            ws[cellRef] = cell;
        }

        async function exportChamCongHC(e) {

                        document.getElementById('lblExportChamCongHC').innerText = "CC Hành Chính";
                    }
                }, 500);
                return;
            }
            if (e) e.preventDefault();

            if (!window.currentDataStore) {
                alert("Chưa có dữ liệu XML để xuất.");
                return;
            }

            if (btn) {
                btn.classList.add('disabled');
                document.getElementById('lblExportChamCongHC').innerText = "Đang xử lý...";
            }
            await new Promise(r => setTimeout(r, 50));

            try {
                const monthsData = getChamCongDataByMonth();
                if (!monthsData) return;

                const wb = XLSX.utils.book_new();

                for (const mKey of Object.keys(monthsData).sort()) {
                    const mInfo = monthsData[mKey];
                    const N = mInfo.daysInMonth;
                    const Y = mInfo.year;
                    const M = mInfo.month;
                    const employees = mInfo.employees;
                    const ws = {};
                    const merges = [];

                    // Row 0 (A1)
                    setSheetCell(ws, 0, 0, ''); // Đơn vị tự điền
                    setSheetCell(ws, 0, 27, 'Mẫu số 01b-LĐTL');
                    merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: 9 } });
                    merges.push({ s: { r: 0, c: 27 }, e: { r: 0, c: 50 } });

                    // Row 1 (A2)
                    setSheetCell(ws, 1, 0, ''); // Đơn vị tự điền
                    setSheetCell(ws, 1, 27, '(Ban hành theo Thông tư số 200/2014/TT-BTC Ngày 22/12/2014 của Bộ Tài Chính)');
                    merges.push({ s: { r: 1, c: 0 }, e: { r: 1, c: 9 } });
                    merges.push({ s: { r: 1, c: 27 }, e: { r: 1, c: 50 } });

                    // Row 3 (A4)
                    setSheetCell(ws, 3, 0, `BẢNG CHẤM CÔNG NHÂN VIÊN \nTHÁNG ${String(M).padStart(2, '0')} /${Y}`);
                    merges.push({ s: { r: 3, c: 0 }, e: { r: 3, c: 50 } });

                    // Row 4 (Tiêu đề bảng)
                    setSheetCell(ws, 4, 0, 'TT');
                    setSheetCell(ws, 4, 1, 'Họ và tên');
                    setSheetCell(ws, 4, 2, 'Số CCHN/\nSố GPHN');
                    setSheetCell(ws, 4, 3, 'Chức vụ/\nBộ phận');
                    setSheetCell(ws, 4, 4, `Tháng ${M}`);
                    merges.push({ s: { r: 4, c: 0 }, e: { r: 6, c: 0 } });
                    merges.push({ s: { r: 4, c: 1 }, e: { r: 6, c: 1 } });
                    merges.push({ s: { r: 4, c: 2 }, e: { r: 6, c: 2 } });
                    merges.push({ s: { r: 4, c: 3 }, e: { r: 6, c: 3 } });
                    merges.push({ s: { r: 4, c: 4 }, e: { r: 4, c: 3 + N } });

                    // Thông số Tháng & Năm góc phải
                    const thangParamCol = 4 + N + 17;
                    setSheetCell(ws, 4, thangParamCol, 'Tháng');
                    setSheetCell(ws, 4, thangParamCol + 1, M);
                    setSheetCell(ws, 4, thangParamCol + 2, 'Năm');
                    setSheetCell(ws, 4, thangParamCol + 3, Y);

                    const thangValColLet = XLSX.utils.encode_col(thangParamCol + 1);
                    const namValColLet = XLSX.utils.encode_col(thangParamCol + 3);

                    // Row 5 (Ngày: thứ tự 1, 2, 3... N) & Row 6 (Thứ: T2, T3... CN)
                    for (let d = 1; d <= N; d++) {
                        const colIdx = 4 + d - 1;
                        const colLet = XLSX.utils.encode_col(colIdx);
                        const wd = new Date(Y, M - 1, d).getDay();
                        const wdStr = wd === 0 ? 'CN' : 'T' + (wd + 1);

                        let dayFormula = '';
                        if (d === 1) {
                            dayFormula = `DATE(${namValColLet}5,${thangValColLet}5,1)`;
                        } else {
                            const prevColLet = XLSX.utils.encode_col(colIdx - 1);
                            dayFormula = `${prevColLet}6+1`;
                        }

                        // Hiển thị số ngày: 1, 2, 3, ... N
                        setSheetCell(ws, 5, colIdx, d, 'n', dayFormula, 'd', String(d));
                        // Hiển thị thứ: T2, T3... CN
                        setSheetCell(ws, 6, colIdx, wdStr, 's', `IF(WEEKDAY(${colLet}6)=1,"CN","T"&WEEKDAY(${colLet}6))`);
                    }

                    // Ký hiệu tổng hợp (Row 5 & Row 6)
                    const codes = [
                        { name: 'x', weight: 1 },
                        { name: 'x\\2', weight: 0.5 },
                        { name: 'x/2', weight: 0.5 },
                        { name: 'P', weight: 1 },
                        { name: 'KL', weight: 1 },
                        { name: 'NL', weight: 1 },
                        { name: 'O', weight: 1 },
                        { name: 'TS', weight: 1 },
                        { name: 'KH', weight: 1 }
                    ];

                    codes.forEach((item, idx) => {
                        const colIdx = 4 + N + idx;
                        setSheetCell(ws, 5, colIdx, item.name);
                        setSheetCell(ws, 6, colIdx, item.weight);
                    });

                    const sumHeaders = [
                        'Tổng\n(ngày công đi làm)',
                        'Nghỉ phép',
                        'Nghỉ không lương',
                        'Nghỉ lễ, tết',
                        'Nghỉ ốm',
                        'Nghỉ Thai sản',
                        'Nghỉ kết hôn'
                    ];

                    sumHeaders.forEach((headerText, idx) => {
                        const colIdx = 4 + N + codes.length + idx;
                        setSheetCell(ws, 5, colIdx, headerText);
                        merges.push({ s: { r: 5, c: colIdx }, e: { r: 6, c: colIdx } });
                    });

                    // Điền dữ liệu nhân viên (Row 7 trở đi)
                    const endDayLetter = XLSX.utils.encode_col(3 + N);
                    const colXLetter = XLSX.utils.encode_col(4 + N);
                    const colX2Letter = XLSX.utils.encode_col(5 + N);
                    const colX3Letter = XLSX.utils.encode_col(6 + N);

                    employees.forEach((emp, eIdx) => {
                        const r = 7 + eIdx;
                        const R = r + 1; // 1-based row in Excel

                        setSheetCell(ws, r, 0, eIdx + 1);
                        setSheetCell(ws, r, 1, emp.hoTen || '');
                        setSheetCell(ws, r, 2, emp.cchn || '');
                        setSheetCell(ws, r, 3, emp.chucVu || '');

                        for (let d = 1; d <= N; d++) {
                            const colIdx = 4 + d - 1;
                            const sym = emp.days[d].adminSym || '';
                            if (sym) {
                                setSheetCell(ws, r, colIdx, sym);
                            }
                        }

                        // Đếm ký hiệu
                        codes.forEach((cItem, cIdx) => {
                            const colIdx = 4 + N + cIdx;
                            const colLet = XLSX.utils.encode_col(colIdx);
                            let calcVal = 0;
                            if (cItem.name === 'x') calcVal = emp.cntX;
                            else if (cItem.name === 'x\\2') calcVal = emp.cntX2;
                            else if (cItem.name === 'x/2') calcVal = emp.cntX3;
                            setSheetCell(ws, r, colIdx, calcVal, 'n', `COUNTIF($E${R}:$${endDayLetter}${R},${colLet}$6)`);
                        });

                        // Cột Tổng (ngày công đi làm)
                        const colTongCongIdx = 4 + N + codes.length;
                        setSheetCell(ws, r, colTongCongIdx, emp.totalWorkingDays, 'n', `SUMPRODUCT(${colXLetter}$7:${colX3Letter}$7,${colXLetter}${R}:${colX3Letter}${R})`);

                        // Các cột nghỉ phép, nghỉ KL, nghỉ lễ...
                        for (let sIdx = 1; sIdx < sumHeaders.length; sIdx++) {
                            const colIdx = colTongCongIdx + sIdx;
                            const targetCodeColLet = XLSX.utils.encode_col(4 + N + 3 + (sIdx - 1));
                            setSheetCell(ws, r, colIdx, 0, 'n', `SUMPRODUCT(${targetCodeColLet}$7:${targetCodeColLet}$7,${targetCodeColLet}${R}:${targetCodeColLet}${R})`);
                        }
                    });

                    // Chú giải & Ký tên
                    const footRow = 7 + employees.length + 1;
                    setSheetCell(ws, footRow, 1, 'Ký hiệu chấm công');
                    setSheetCell(ws, footRow, 2, 'x : làm việc từ 7h00-17h00');
                    setSheetCell(ws, footRow + 1, 2, 'x\\2: làm việc từ 07h00-11h30 ( nửa ngày)');
                    setSheetCell(ws, footRow + 2, 2, 'x/2: làm việc từ 13h30-17h00 ( nửa ngày)');
                    setSheetCell(ws, footRow + 3, 2, 'P: nghỉ phép');
                    setSheetCell(ws, footRow + 4, 2, 'KL: nghỉ không lương');
                    setSheetCell(ws, footRow + 5, 2, 'TS: nghỉ thai sản');
                    setSheetCell(ws, footRow + 6, 2, 'O: nghỉ ốm đau');
                    setSheetCell(ws, footRow + 7, 2, 'KH: nghỉ kết hôn');
                    setSheetCell(ws, footRow + 8, 2, 'NL: nghỉ lễ, tết');

                    setSheetCell(ws, footRow + 9, 31, 'Ngày ..... tháng ..... năm .....');
                    setSheetCell(ws, footRow + 10, 0, 'Người lập');
                    setSheetCell(ws, footRow + 10, 14, 'Kế toán');
                    setSheetCell(ws, footRow + 10, 31, 'Thủ trưởng đơn vị');

                    setSheetCell(ws, footRow + 11, 0, '(Ký, họ tên)');
                    setSheetCell(ws, footRow + 11, 14, '(Ký, họ tên)');
                    setSheetCell(ws, footRow + 11, 31, '(Ký, họ tên, đóng dấu)');

                    ws['!merges'] = merges;
                    ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: footRow + 16, c: 4 + N + 22 } });

                    // Độ rộng cột
                    const colWidths = [{ wch: 5 }, { wch: 22 }, { wch: 18 }, { wch: 20 }];
                    for (let c = 4; c < 4 + N; c++) colWidths.push({ wch: 4.8 });
                    for (let c = 4 + N; c < 4 + N + 23; c++) colWidths.push({ wch: 6 });
                    ws['!cols'] = colWidths;

                    XLSX.utils.book_append_sheet(wb, ws, `Tháng ${M}`);
                }

                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/octet-stream' });
                window.cachedWbChamCongHCUrl = URL.createObjectURL(blob);

            } catch (err) {
                console.error("Lỗi xuất bảng chấm công hành chính:", err);
                alert("Lỗi xuất chấm công hành chính: " + err.message);
            } finally {
                if (btn) {
                    btn.classList.remove('disabled');
                    if (window.cachedWbChamCongHCUrl) {
                        btn.href = window.cachedWbChamCongHCUrl;
                        btn.download = "CHAMCONG_HANHCHINH.xlsx";
                        btn.style.color = '#ff9800';
                        document.getElementById('lblExportChamCongHC').innerText = "Hoàn tất! Tải Về";
                    } else {
                        btn.href = "javascript:void(0)";
                        btn.removeAttribute("download");
                        document.getElementById('lblExportChamCongHC').innerText = "CC Hành Chính";
                    }
                }
            }
        }

        async function exportChamCongNG(e) {
            const btn = document.getElementById('btnExportChamCongNG');
            if (window.cachedWbChamCongNGUrl) {
                setTimeout(() => {
                    URL.revokeObjectURL(window.cachedWbChamCongNGUrl);
                    window.cachedWbChamCongNGUrl = null;
                    if (btn) {
                        btn.href = "javascript:void(0)";
                        btn.removeAttribute("download");
                        btn.style.color = '#333';
                        document.getElementById('lblExportChamCongNG').innerText = "CC Ngoài Giờ";
                    }
                }, 500);
                return;
            }
            if (e) e.preventDefault();

            if (!window.currentDataStore) {
                alert("Chưa có dữ liệu XML để xuất.");
                return;
            }

            if (btn) {
                btn.classList.add('disabled');
                document.getElementById('lblExportChamCongNG').innerText = "Đang xử lý...";
            }
            await new Promise(r => setTimeout(r, 50));

            try {
                const monthsData = getChamCongDataByMonth();
                if (!monthsData) return;

                const wb = XLSX.utils.book_new();

                for (const mKey of Object.keys(monthsData).sort()) {
                    const mInfo = monthsData[mKey];
                    const N = mInfo.daysInMonth;
                    const Y = mInfo.year;
                    const M = mInfo.month;
                    const employees = mInfo.employees;
                    const ws = {};
                    const merges = [];

                    const totalEndColIdx = 5 + 2 * N;
                    const totalMinColIdx = 6 + 2 * N;
                    const totalHourColIdx = 7 + 2 * N;

                    // Row 0 (A1)
                    setSheetCell(ws, 0, 0, ''); // Đơn vị tự điền
                    setSheetCell(ws, 0, totalMinColIdx - 16, 'Mẫu số 01b-LĐTL');
                    merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: 16 } });
                    merges.push({ s: { r: 0, c: totalMinColIdx - 16 }, e: { r: 0, c: totalMinColIdx } });

                    // Row 1 (A2)
                    setSheetCell(ws, 1, 0, ''); // Đơn vị tự điền
                    setSheetCell(ws, 1, totalMinColIdx - 16, '(Ban hành theo Thông tư số 200/2014/TT-BTC Ngày 22/12/2014 của Bộ Tài Chính)');
                    merges.push({ s: { r: 1, c: 0 }, e: { r: 1, c: 16 } });
                    merges.push({ s: { r: 1, c: totalMinColIdx - 16 }, e: { r: 1, c: totalMinColIdx } });

                    // Row 3 (G4)
                    setSheetCell(ws, 3, 6, 'BẢNG CHẤM CÔNG NGOÀI GIỜ NHÂN VIÊN');
                    merges.push({ s: { r: 3, c: 6 }, e: { r: 3, c: totalEndColIdx } });

                    // Row 4 (Tiêu đề bảng)
                    setSheetCell(ws, 4, 0, 'TT');
                    setSheetCell(ws, 4, 1, 'Họ và tên');
                    setSheetCell(ws, 4, 2, 'Chức vụ/\nBộ phận');
                    setSheetCell(ws, 4, 3, 'CCHN/\nGPHN');
                    setSheetCell(ws, 4, 6, `Tháng ${M}`);
                    setSheetCell(ws, 4, totalMinColIdx, 'Tổng\nSố Phút ngoài giờ');
                    setSheetCell(ws, 4, totalHourColIdx, 'Tổng\nGiờ');

                    merges.push({ s: { r: 4, c: 0 }, e: { r: 6, c: 0 } });
                    merges.push({ s: { r: 4, c: 1 }, e: { r: 6, c: 1 } });
                    merges.push({ s: { r: 4, c: 2 }, e: { r: 6, c: 2 } });
                    merges.push({ s: { r: 4, c: 3 }, e: { r: 6, c: 3 } });
                    merges.push({ s: { r: 4, c: 4 }, e: { r: 6, c: 4 } });
                    merges.push({ s: { r: 4, c: 6 }, e: { r: 4, c: totalEndColIdx } });
                    merges.push({ s: { r: 4, c: totalMinColIdx }, e: { r: 6, c: totalMinColIdx } });
                    merges.push({ s: { r: 4, c: totalHourColIdx }, e: { r: 6, c: totalHourColIdx } });

                    // Thông số Tháng & Năm góc phải
                    setSheetCell(ws, 4, totalHourColIdx + 1, 'Tháng');
                    setSheetCell(ws, 4, totalHourColIdx + 2, M);
                    setSheetCell(ws, 4, totalHourColIdx + 3, 'Năm');
                    setSheetCell(ws, 4, totalHourColIdx + 4, Y);

                    const thangValColLet = XLSX.utils.encode_col(totalHourColIdx + 2);
                    const namValColLet = XLSX.utils.encode_col(totalHourColIdx + 4);

                    // Row 5 (Ngày: thứ tự 1, 2, 3...) & Row 6 (Thứ: T2, T3... CN) & Row 7 (Trưa / Tối)
                    setSheetCell(ws, 7, 4, 'Trưa');
                    setSheetCell(ws, 7, 5, 'Tối');

                    for (let d = 1; d <= N; d++) {
                        const cTrua = 6 + 2 * (d - 1);
                        const cToi = cTrua + 1;
                        const colLet = XLSX.utils.encode_col(cTrua);
                        const wd = new Date(Y, M - 1, d).getDay();
                        const wdStr = wd === 0 ? 'CN' : 'T' + (wd + 1);

                        let dayFormula = '';
                        if (d === 1) {
                            dayFormula = `DATE(${namValColLet}5,${thangValColLet}5,1)`;
                        } else {
                            const prevDayColLet = XLSX.utils.encode_col(cTrua - 2);
                            dayFormula = `${prevDayColLet}6+1`;
                        }

                        // Row 6 (index 5): số ngày 1, 2, 3... merged 2 cột Trưa & Tối
                        setSheetCell(ws, 5, cTrua, d, 'n', dayFormula, 'd', String(d));
                        merges.push({ s: { r: 5, c: cTrua }, e: { r: 5, c: cToi } });

                        // Row 7 (index 6): Thứ T2, T3... CN merged 2 cột Trưa & Tối
                        setSheetCell(ws, 6, cTrua, wdStr, 's', `IF(WEEKDAY(${colLet}6)=1,"CN","T"&WEEKDAY(${colLet}6))`);
                        merges.push({ s: { r: 6, c: cTrua }, e: { r: 6, c: cToi } });

                        // Row 8 (index 7): Trưa / Tối
                        setSheetCell(ws, 7, cTrua, 'Trưa');
                        setSheetCell(ws, 7, cToi, 'Tối');
                    }

                    // Điền dữ liệu nhân viên (Row 8 trở đi)
                    const endDayColLetter = XLSX.utils.encode_col(totalEndColIdx);
                    const totalMinColLetter = XLSX.utils.encode_col(totalMinColIdx);
                    const totalHourColLetter = XLSX.utils.encode_col(totalHourColIdx);

                    employees.forEach((emp, eIdx) => {
                        const r = 8 + eIdx;
                        const R = r + 1;

                        setSheetCell(ws, r, 0, eIdx + 1);
                        setSheetCell(ws, r, 1, emp.hoTen || '');
                        setSheetCell(ws, r, 2, emp.chucVu || '');
                        setSheetCell(ws, r, 3, emp.cchn || '');

                        // Baseline trưa 11:30 và tối 17:00
                        setSheetCell(ws, r, 4, (11 * 3600 + 30 * 60) / 86400, 'n', null, 'h:mm;@', '11:30:00');
                        setSheetCell(ws, r, 5, (17 * 3600) / 86400, 'n', null, 'h:mm;@', '17:00:00');

                        for (let d = 1; d <= N; d++) {
                            const dInfo = emp.days[d];
                            const cTrua = 6 + 2 * (d - 1);
                            const cToi = cTrua + 1;

                            if (dInfo.truaFraction !== null) {
                                setSheetCell(ws, r, cTrua, dInfo.truaFraction, 'n', null, 'h:mm;@', dInfo.truaTimeStr);
                            }
                            if (dInfo.toiFraction !== null) {
                                setSheetCell(ws, r, cToi, dInfo.toiFraction, 'n', null, 'h:mm;@', dInfo.toiTimeStr);
                            }
                        }

                        // Công thức & kết quả tổng phút ngoài giờ
                        const formulaPhut = `SUMPRODUCT((ISNUMBER(G${R}:${endDayColLetter}${R}))*(MOD(COLUMN(G${R}:${endDayColLetter}${R})-COLUMN(G${R}),2)=0)*(G${R}:${endDayColLetter}${R}>$E${R})*(G${R}:${endDayColLetter}${R}-$E${R})*1440)+SUMPRODUCT((ISNUMBER(G${R}:${endDayColLetter}${R}))*(MOD(COLUMN(G${R}:${endDayColLetter}${R})-COLUMN(G${R}),2)=1)*(G${R}:${endDayColLetter}${R}>$F${R})*(G${R}:${endDayColLetter}${R}-$F${R})*1440)`;
                        setSheetCell(ws, r, totalMinColIdx, Math.round(emp.totalOvertimeMins), 'n', formulaPhut);

                        // Công thức & kết quả tổng giờ
                        const hours = Math.floor(emp.totalOvertimeMins / 60);
                        const mins = Math.round(emp.totalOvertimeMins % 60);
                        const hourStr = `${hours} giờ ${mins} phút`;
                        const formulaGio = `QUOTIENT(ROUND(${totalMinColLetter}${R},0),60)&" giờ "&MOD(ROUND(${totalMinColLetter}${R},0),60)&" phút"`;
                        setSheetCell(ws, r, totalHourColIdx, hourStr, 's', formulaGio);
                    });

                    // Chữ ký footer
                    const footRow = 8 + employees.length + 1;
                    setSheetCell(ws, footRow, 1, 'Ký hiệu chấm công');
                    setSheetCell(ws, footRow, 2, 'x : làm việc từ 7h00-17h00');
                    setSheetCell(ws, footRow + 1, 2, 'TS: nghỉ thai sản');
                    setSheetCell(ws, footRow + 2, 2, 'O: nghỉ ốm đau');
                    setSheetCell(ws, footRow + 3, 2, 'KH: nghỉ kết hôn');
                    setSheetCell(ws, footRow + 4, 2, 'NL: nghỉ lễ, tết');

                    setSheetCell(ws, footRow + 5, 40, 'Ngày ..... tháng ..... năm .....');

                    setSheetCell(ws, footRow + 6, 0, 'Người lập');
                    setSheetCell(ws, footRow + 6, 16, 'Kế toán');
                    setSheetCell(ws, footRow + 6, 40, 'Thủ trưởng đơn vị');

                    setSheetCell(ws, footRow + 7, 0, '(Ký, họ tên)');
                    setSheetCell(ws, footRow + 7, 16, '(Ký, họ tên)');
                    setSheetCell(ws, footRow + 7, 40, '(Ký, họ tên, đóng dấu)');

                    ws['!merges'] = merges;
                    ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: footRow + 10, c: totalHourColIdx + 5 } });

                    // Độ rộng cột
                    const colWidths = [{ wch: 6 }, { wch: 20 }, { wch: 18 }, { wch: 16 }, { wch: 8 }, { wch: 8 }];
                    for (let c = 6; c <= totalEndColIdx; c++) colWidths.push({ wch: 7.2 });
                    colWidths.push({ wch: 16 }); // Phut
                    colWidths.push({ wch: 18 }); // Gio
                    ws['!cols'] = colWidths;

                    XLSX.utils.book_append_sheet(wb, ws, `Tháng ${M} - Ngoài giờ`);
                }

                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/octet-stream' });
                window.cachedWbChamCongNGUrl = URL.createObjectURL(blob);

            } catch (err) {
                console.error("Lỗi xuất bảng chấm công ngoài giờ:", err);
                alert("Lỗi xuất chấm công ngoài giờ: " + err.message);
            } finally {
                if (btn) {
                    btn.classList.remove('disabled');
                    if (window.cachedWbChamCongNGUrl) {
                        btn.href = window.cachedWbChamCongNGUrl;
                        btn.download = "CHAMCONG_NGOAIGIO.xlsx";
                        btn.style.color = '#ff9800';
                        document.getElementById('lblExportChamCongNG').innerText = "Hoàn tất! Tải Về";
                    } else {
                        btn.href = "javascript:void(0)";
                        btn.removeAttribute("download");
                        document.getElementById('lblExportChamCongNG').innerText = "CC Ngoài Giờ";
                    }
                }
            }
        }
    </script>
