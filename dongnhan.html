<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Dữ Liệu RHM & In Phiếu Thủ Thuật</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        /* GIAO DIỆN CHÍNH */
        body { font-family: Tahoma, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 1450px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }

        /* THANH TÌM KIẾM */
        .search-box { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; background: #e9ecef; padding: 15px; border-radius: 8px; }
        input[type="date"], input[type="text"] { padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-family: Tahoma; }
        button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-search { background-color: #007bff; color: white; }
        .btn-search:hover { background-color: #0056b3; }
        .btn-group { background-color: #6c757d; color: white; }

        /* BẢNG DỮ LIỆU */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; background: white; }
        th, td { border: 1px solid #dee2e6; padding: 12px 8px; text-align: left; }
        th { background-color: #007bff; color: white; position: sticky; top: 0; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #f1f4f9; }

        /* NÚT THAO TÁC */
        .btn-edit { background-color: #ffc107; color: #212529; font-size: 11px; padding: 6px 12px; }
        .btn-print-cd { background-color: #17a2b8; color: white; font-size: 11px; padding: 6px 12px; margin-bottom: 4px; display: block; width: 100%; }
        .btn-print-pt { background-color: #28a745; color: white; font-size: 11px; padding: 6px 12px; display: block; width: 100%; }

        /* MODAL CHỈNH SỬA */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 25px; border-radius: 10px; width: 650px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .modal-header { font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #007bff; border-bottom: 2px solid #f1f1f1; padding-bottom: 10px;}
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: Tahoma; }
        .form-group textarea { height: 100px; }
        .quick-fill-area { background: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 5px solid #17a2b8; margin-bottom: 20px; }
        .btn-save { background-color: #28a745; color: white; padding: 10px 25px; }
        .btn-cancel { background-color: #6c757d; color: white; padding: 10px 25px; margin-right: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Tra Cứu Dữ Liệu & In Phiếu Thủ Thuật</h2>
    
    <div class="search-box">
        <input type="date" id="searchDate">
        <input type="text" id="searchName" placeholder="Tên bệnh nhân..." style="min-width: 250px;">
        <button class="btn-search" onclick="searchData()">Tra cứu</button>
        <button class="btn-group" onclick="groupByPatient()">Nhóm theo Bệnh nhân</button>
    </div>

    <div id="loading" style="text-align:center; display:none; font-style:italic;">Đang tải dữ liệu hệ thống...</div>
    <div id="noDataMessage" style="text-align:center; color:red; display:none; font-weight:bold;">Không tìm thấy dữ liệu.</div>

    <div style="overflow-x:auto;">
        <table id="resultTable" style="display: none;">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã BN</th>
                    <th>Họ tên</th>
                    <th>Tuổi</th>
                    <th>Giới tính</th>
                    <th>Ngày vào</th>
                    <th>Chẩn đoán</th>
                    <th>Tên DVKT</th>
                    <th>Y lệnh</th>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>BS thực hiện</th>
                    <th style="min-width: 130px;">Thao tác</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header" id="modalTitle">Chỉnh sửa thông tin</div>
        
        <div class="form-group">
            <label>Thời gian kết thúc:</label>
            <input type="text" id="editKetThuc" placeholder="HH:mm dd/MM/yyyy">
        </div>

        <div class="form-group">
            <label>Chẩn đoán:</label>
            <input type="text" id="editChanDoan">
        </div>

        <div class="quick-fill-area">
            <label style="color: #0056b3;">Điền nhanh vị trí răng (thay ... hoặc …):</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="quickFillInput" placeholder="Ví dụ: 36, 46" style="flex: 1;">
                <button onclick="applyQuickFill()" style="background: #17a2b8; color: white;">Áp dụng</button>
            </div>
        </div>

        <div class="form-group">
            <label>Tóm tắt quá trình làm thủ thuật:</label>
            <textarea id="editTomTat"></textarea>
        </div>
        
        <div style="text-align: right;">
            <button class="btn-cancel" onclick="closeModal()">Hủy</button>
            <button class="btn-save" onclick="saveData()">Lưu thay đổi</button>
        </div>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQpmjgWq53GTt4cT8K_3yOGwYWHj8fbIcQqJGivg-2ZMwVl3dwrK5NzBXoK3-gCqPk7cnefZXfvD9Bs/pub?gid=607449787&single=true&output=csv';
    let allData = [], currentFilteredData = [], isDataLoaded = false, editingIndex = -1;

    window.onload = function() {
        document.getElementById('loading').style.display = 'block';
        Papa.parse(CSV_URL, {
            download: true, header: true, skipEmptyLines: true,
            complete: (results) => {
                allData = results.data;
                isDataLoaded = true;
                document.getElementById('loading').style.display = 'none';
            }
        });
    };

    // --- HÀM TRỢ GIÚP (HELPER FUNCTIONS) ---

    function standardizeDateTime(str) {
        if (!str) return '';
        str = str.trim();
        let m1 = str.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s+(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (m1) return `${m1[1].padStart(2, '0')}:${m1[2].padStart(2, '0')} ${m1[3].padStart(2, '0')}/${m1[4].padStart(2, '0')}/${m1[5]}`;
        let m2 = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::\d{2})?$/);
        if (m2) return `${m2[4].padStart(2, '0')}:${m2[5].padStart(2, '0')} ${m2[1].padStart(2, '0')}/${m2[2].padStart(2, '0')}/${m2[3]}`;
        return str;
    }

    function addOneMinute(dateTimeStr) {
        if (!dateTimeStr) return '';
        const parts = dateTimeStr.split(' ');
        if (parts.length !== 2) return dateTimeStr;
        const [time, date] = parts;
        const [hh, mm] = time.split(':');
        const [d, m, y] = date.split('/');
        let dObj = new Date(y, m - 1, d, hh, mm);
        dObj.setMinutes(dObj.getMinutes() + 1);
        const pad = (n) => String(n).padStart(2, '0');
        return `${pad(dObj.getHours())}:${pad(dObj.getMinutes())} ${pad(dObj.getDate())}/${pad(dObj.getMonth() + 1)}/${dObj.getFullYear()}`;
    }

    function processAddress(address) {
        if (!address) return '';
        const keywords = [/Quảng Nam/i, /Đà Nẵng/i];
        for (let kw of keywords) {
            let match = address.match(kw);
            if (match) return address.substring(0, match.index + match[0].length);
        }
        return address;
    }

    // --- XỬ LÝ DỮ LIỆU BẢNG ---

    function searchData() {
        if (!isDataLoaded) return;
        const dateInput = document.getElementById('searchDate').value;
        const nameInput = document.getElementById('searchName').value.trim().toLowerCase();
        if (!dateInput && !nameInput) return alert("Nhập thông tin tìm kiếm!");

        let targetDate = dateInput ? dateInput.split('-').reverse().join('/') : '';

        currentFilteredData = allData.filter(row => {
            const matchDate = targetDate ? (row['ngay_vao'] || '').includes(targetDate) : true;
            const matchName = nameInput ? (row['ho_ten'] || '').toLowerCase().includes(nameInput) : true;
            return matchDate && matchName && row['ho_ten'];
        });

        if (currentFilteredData.length === 0) {
            document.getElementById('resultTable').style.display = 'none';
            document.getElementById('noDataMessage').style.display = 'block';
        } else {
            renderTable();
            document.getElementById('noDataMessage').style.display = 'none';
            document.getElementById('resultTable').style.display = 'table';
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        currentFilteredData.forEach((row, index) => {
            row.y_lenh_fmt = standardizeDateTime(row['y_lenh']);
            row.bat_dau_fmt = standardizeDateTime(row['bat_dau']);
            row.ket_thuc_fmt = standardizeDateTime(row['ket_thuc']);
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row['STT'] || ''}</td>
                <td>${row['mabn'] || ''}</td>
                <td><strong>${row['ho_ten']}</strong></td>
                <td>${row['tuoi'] || ''}</td>
                <td>${row['gioi_tinh'] || ''}</td>
                <td>${row['ngay_vao'] || ''}</td>
                <td style="color:red;">${row['chan_doan']}</td>
                <td>${row['ten_dv']}</td>
                <td>${row.y_lenh_fmt}</td>
                <td style="color:blue;">${row.bat_dau_fmt}</td>
                <td style="color:red;">${row.ket_thuc_fmt}</td>
                <td>${row['bs_thuchien']}</td>
                <td>
                    <button class="btn-edit" onclick="openModal(${index})">Sửa</button>
                    <button class="btn-print-cd" onclick="printChiDinh(${index})">In Chỉ Định</button>
                    <button class="btn-print-pt" onclick="printPhieu(${index})">In Phiếu PTTT</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- MODAL & CHỈNH SỬA ---

    function openModal(index) {
        editingIndex = index;
        const data = currentFilteredData[index];
        document.getElementById('modalTitle').innerText = `Sửa: ${data.ho_ten}`;
        
        let kt = data.ket_thuc_fmt || data.ket_thuc || '';
        if (!kt || kt.trim() === "") kt = addOneMinute(data.bat_dau_fmt);

        document.getElementById('editKetThuc').value = kt;
        document.getElementById('editChanDoan').value = data.chan_doan || '';
        document.getElementById('editTomTat').value = data.tom_tat || '';
        document.getElementById('editModal').style.display = 'block';
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }

    function saveData() {
        const d = currentFilteredData[editingIndex];
        d.ket_thuc = document.getElementById('editKetThuc').value;
        d.chan_doan = document.getElementById('editChanDoan').value;
        d.tom_tat = document.getElementById('editTomTat').value;
        closeModal();
        renderTable();
    }

    function applyQuickFill() {
        const val = document.getElementById('quickFillInput').value;
        const area = document.getElementById('editTomTat');
        area.value = area.value.replace(/(\.{3,}|…)/g, val);
    }

    // --- IN ẤN ---

    function printChiDinh(index) {
        const data = currentFilteredData[index];
        const addr = processAddress(data.dia_chi);
        const win = window.open('', '_blank');
        win.document.write(`<html><head><title>In Chỉ Định</title><style>body{font-family:'Times New Roman';font-size:13pt;padding:20px;}</style></head>
        <body>
            <div style="text-align:center;font-weight:bold;">PHÒNG KHÁM ĐA KHOA ĐỒNG NHÂN</div>
            <h1 style="text-align:center;">PHIẾU CHỈ ĐỊNH</h1>
            <p>Bệnh nhân: <b>${data.ho_ten}</b> | Tuổi: ${data.tuoi} | Giới tính: ${data.gioi_tinh}</p>
            <p>Địa chỉ: ${addr}</p>
            <p>Chẩn đoán: ${data.chan_doan}</p>
            <table border="1" style="width:100%;border-collapse:collapse;margin-top:10px;">
                <tr><th>STT</th><th>Tên dịch vụ</th><th>SL</th></tr>
                <tr><td align="center">1</td><td>${data.ten_dv}</td><td align="center">1</td></tr>
            </table>
            <div style="float:right;margin-top:30px;text-align:center;">
                <i>Ngày...tháng...năm...</i><br><b>BÁC SĨ CHỈ ĐỊNH</b><br><br><br><br><b>${data.bs_thuchien}</b>
            </div>
            <script>window.print();<\/script>
        </body></html>`);
        win.document.close();
    }

    function printPhieu(index) {
        const data = currentFilteredData[index];
        const addr = processAddress(data.dia_chi);
        const tomTat = (data.tom_tat || data.ten_dv).replace(/\n/g, '<br>');
        const win = window.open('', '_blank');
        win.document.write(`<html><head><title>Phiếu Thủ Thuật</title><style>body{font-family:'Times New Roman';font-size:13pt;padding:30px;line-height:1.5;}</style></head>
        <body>
            <div style="float:left;text-align:center;">SỞ Y TẾ...<br><b>PK ĐA KHOA ĐỒNG NHÂN</b></div>
            <div style="float:right;">Mã BN: ${data.mabn}</div>
            <div style="clear:both;"></div>
            <h1 style="text-align:center;margin-top:20px;">PHIẾU THỦ THUẬT</h1>
            <p>1. Họ tên: <b>${data.ho_ten.toUpperCase()}</b> | Tuổi: ${data.tuoi} | Giới tính: ${data.gioi_tinh}</p>
            <p>2. Chẩn đoán: ${data.chan_doan}</p>
            <p>3. Phương pháp: ${data.ten_dv}</p>
            <p>4. Bác sĩ thực hiện: ${data.bs_thuchien}</p>
            <p>5. Thời gian: Từ ${data.bat_dau_fmt} đến ${data.ket_thuc_fmt || '...'}</p>
            <p><b>TÓM TẮT QUÁ TRÌNH:</b></p>
            <div style="min-height:100px;border:1px solid #ccc;padding:10px;">${tomTat}</div>
            <div style="float:right;margin-top:30px;text-align:center;">
                <i>Ngày...tháng...năm...</i><br><b>BÁC SĨ THỰC HIỆN</b><br><br><br><br><b>${data.bs_thuchien}</b>
            </div>
            <script>window.print();<\/script>
        </body></html>`);
        win.document.close();
    }
</script>
</body>
</html>
