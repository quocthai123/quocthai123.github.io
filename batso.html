<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Lấy Số Bệnh Viện</title>
    <style>
        /* --- 1. CẤU HÌNH GIAO DIỆN KIOSK FULL MÀN HÌNH --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            height: 100vh; /* Chiều cao 100% màn hình */
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Ẩn thanh cuộn */
        }

        .screen-container {
            background: white;
            width: 95%; /* Chiếm 95% màn hình */
            height: 95%; /* Chiếm 95% chiều cao */
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Chia đều khoảng cách các phần */
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        /* --- LOGO & TIÊU ĐỀ --- */
        .header-section {
            text-align: center;
            flex: 1; /* Chiếm 1 phần không gian */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hospital-logo {
            height: 120px; /* Logo to hơn */
            width: auto;
            margin-bottom: 20px;
        }

        .main-title {
            color: #0056b3;
            margin: 0;
            font-size: 3vw; /* Cỡ chữ tự chỉnh theo độ rộng màn hình */
            font-weight: 800;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .sub-title {
            margin: 10px 0 0 0;
            font-size: 2vw;
            color: #555;
        }

        /* --- KHU VỰC HIỂN THỊ SỐ (NHỎ GỌN LẠI) --- */
        .info-section {
            margin: 20px 0;
            font-size: 24px;
            color: #666;
        }

        #screen-number {
            color: #dc3545;
            font-size: 40px;
            font-weight: bold;
        }

        /* --- 2. NÚT BẤM KHỔNG LỒ (THEO YÊU CẦU) --- */
        .action-section {
            flex: 2; /* Chiếm 2 phần không gian (Rộng gấp đôi phần header) */
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .btn-print {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            width: 90%;
            height: 80%; /* Nút cao, to */
            font-size: 5vw; /* Chữ cực to */
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 86, 179, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column; /* Để icon nằm trên chữ */
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse-animation 2s infinite; /* Hiệu ứng nhịp thở */
        }

        /* Hiệu ứng bấm nút */
        .btn-print:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Hiệu ứng nhịp thở để thu hút */
        @keyframes pulse-animation {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 123, 255, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(0, 123, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 123, 255, 0); }
        }

        .note-text {
            margin-top: 20px;
            font-size: 18px;
            color: #888;
            font-style: italic;
        }

        /* --- NÚT RESET ẨN (Góc dưới phải) --- */
        .btn-reset {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: none;
            border: 1px dashed #ddd;
            color: #ddd;
            font-size: 14px;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .btn-reset:hover {
            opacity: 1;
            color: red;
            border-color: red;
        }

        /* --- 3. CSS IN ẤN (GIỮ NGUYÊN TUYỆT ĐỐI) --- */
        #print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            .screen-container { display: none; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                display: block; position: absolute; top: 0; left: 0; width: 100%;
                margin: 0; padding: 0 2px; text-align: center; color: black;
            }
            .hospital-name-print {
                font-family: "Times New Roman", Times, serif; font-size: 16px; font-weight: bold; text-transform: uppercase; margin-top: 5px; margin-bottom: 5px; line-height: 1.2;
            }
            .service-name-print {
                font-family: "Times New Roman", Times, serif; font-size: 20px; font-weight: bold; margin-bottom: 5px;
            }
            .ticket-number-print {
                font-family: Arial, sans-serif; font-size: 100px; font-weight: 900; line-height: 1; margin: 5px 0;
            }
            .print-time-print {
                font-family: "Times New Roman", Times, serif; font-size: 12px; margin-top: 5px; margin-bottom: 20px;
            }
            @page { margin: 0; size: auto; }
        }
    </style>
</head>
<body>
    <div class="screen-container">
        <div class="header-section">
            <img src="/img/logopng-removebg-preview.png" 
                 onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%230056b3\' stroke-width=\'2\'><path d=\'M22 12h-4l-3 9L9 3l-3 9H2\'></path></svg>'"
                 alt="Logo" class="hospital-logo">
            <h1 class="main-title">BỆNH VIỆN PHỤC HỒI CHỨC NĂNG</h1>
            <h2 class="sub-title">Hệ thống lấy số tự động</h2>
            <div class="info-section">
                Số đang cấp: <span id="screen-number">---</span>
            </div>
        </div>
        
        <div class="action-section">
            <button class="btn-print" onclick="processPrint()">
                <span style="font-size: 60px; margin-bottom: 10px;">🖨️</span>
                BẤM ĐỂ LẤY SỐ
            </button>
            <p class="note-text">Vui lòng chờ lấy phiếu tại máy in</p>
        </div>

        <button class="btn-reset" onclick="manualReset()" title="Reset về 0">
            ⚙️ Cài đặt lại số
        </button>
    </div>

    <div id="print-area">
        <div class="hospital-name-print">BV PHCN ĐỒNG THÁP</div>
        <div class="service-name-print">Khám bệnh</div>
        <div class="ticket-number-print" id="ticket-num">00</div>
        <div class="print-time-print" id="ticket-time">Ngày in: ...</div>
    </div>

    <script>
        const KEY_DATE = 'last_print_date_v2';
        const KEY_COUNT = 'current_count_v2';

        function getToday() { return new Date().toLocaleDateString('vi-VN'); }

        function getNextNumber() {
            const today = getToday();
            const lastDate = localStorage.getItem(KEY_DATE);
            let count = parseInt(localStorage.getItem(KEY_COUNT) || '0');
            if (lastDate !== today) {
                count = 0;
                localStorage.setItem(KEY_DATE, today);
            }
            count++;
            localStorage.setItem(KEY_COUNT, count);
            return count;
        }

        function getFormattedDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB'); 
            const timeStr = now.toLocaleTimeString('en-US', { hour12: true, hour: 'numeric', minute: 'numeric', second: 'numeric' });
            return `Ngày in: ${dateStr} ${timeStr}`;
        }

        function updateScreen() {
            const current = localStorage.getItem(KEY_COUNT) || 0;
            document.getElementById('screen-number').innerText = current > 0 ? current : '--';
        }

        function processPrint() {
            const newNum = getNextNumber();
            document.getElementById('ticket-num').innerText = newNum;
            document.getElementById('ticket-time').innerText = getFormattedDateTime();
            updateScreen();

            // Delay 150ms để giao diện cập nhật trước khi in
            setTimeout(function() {
                window.print();
            }, 150);
        }

        function manualReset() {
            if (confirm("⚠️ CẢNH BÁO QUẢN TRỊ:\nBạn có chắc chắn muốn đặt lại số thứ tự về 0 không?")) {
                localStorage.setItem(KEY_COUNT, 0);
                updateScreen();
            }
        }

        updateScreen();
    </script>
</body>
</html>
