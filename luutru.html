<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển đổi mẫu lưu trú - Đề án 06</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Bảng màu sang trọng: Xanh Navy & Điểm nhấn Vàng/Cam nhạt */
            --primary-color: #1e3a8a; /* Xanh Navy sâu */
            --primary-hover: #1e40af;
            --accent-color: #d97706; /* Vàng đồng */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --radius-md: 10px;
            --radius-lg: 20px;
            --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 45px 55px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border-top: 5px solid var(--primary-color);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Vùng chứa Logo */
        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            height: 65px; /* Điều chỉnh kích thước logo tại đây */
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .logo-container a:hover img {
            transform: scale(1.05);
        }

        h2 {
            color: var(--primary-color);
            margin: 0;
            font-weight: 800;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subtitle {
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
        }

        /* Banner Đề án 06 */
        .banner-de-an {
            background-color: #fffbeb;
            border-left: 4px solid var(--accent-color);
            padding: 16px 20px;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin-bottom: 35px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: #92400e;
            font-size: 14.5px;
            line-height: 1.5;
            box-shadow: var(--shadow-soft);
        }

        .banner-de-an svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            color: var(--accent-color);
            margin-top: 2px;
        }

        /* Grid layout */
        .row-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        label svg {
            width: 18px;
            height: 18px;
            color: var(--primary-color);
        }

        input[type="datetime-local"] {
            width: 100%;
            padding: 14px 16px;
            box-sizing: border-box;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #f8fafc;
            color: var(--text-main);
            font-family: inherit;
        }

        input[type="datetime-local"]:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1);
        }

        /* Custom file input */
        .file-upload-wrapper {
            position: relative;
            padding: 40px 30px;
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-md);
            background-color: #f8fafc;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        input[type="file"] {
            background: white;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 100%;
            max-width: 400px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background: linear-gradient(135deg, var(--primary-hover) 0%, #1d4ed8 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(30, 58, 138, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        #status {
            margin-top: 25px;
            text-align: center;
            font-size: 15px;
            min-height: 24px;
            font-weight: 600;
            padding: 12px;
            border-radius: var(--radius-md);
            display: none; /* Ẩn khi chưa có thông báo */
        }
        
        .note {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 12px;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 30px 20px; }
            .row-grid { grid-template-columns: 1fr; gap: 15px; }
            h2 { font-size: 22px; }
            .banner-de-an { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-container">
            <a href="#" target="_blank" title="Trang chủ">
                <img src="https://raw.githubusercontent.com/quocthai123/quocthai123.github.io/refs/heads/main/img/logopng-removebg-preview.png" alt="Logo Cơ Quan">
            </a>
        </div>
        
        <h2>Chuyển đổi mẫu lưu trú</h2>
        <div class="subtitle">Xử lý dữ liệu KCB cho CSDL Dân cư Quốc gia</div>
    </div>
    
    <div class="banner-de-an">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
        </svg>
        <span><strong>Thực hiện Đề án 06 của Chính phủ</strong>, tăng cường triển khai phần mềm ASM trong quản lý lưu trú và y tế nhằm mang lại tiện ích tốt nhất cho người dân.</span>
    </div>
    
    <div class="row-grid">
        <div class="form-group">
            <label for="dateIn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                Thời gian vào (Từ ngày) <span style="color:#ef4444">*</span>
            </label>
            <input type="datetime-local" id="dateIn">
        </div>

        <div class="form-group">
            <label for="dateOut">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>
                Thời gian ra (Đến ngày)
            </label>
            <input type="datetime-local" id="dateOut">
        </div>
    </div>

    <div class="form-group">
        <label for="upload">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>
            Tệp dữ liệu Báo cáo tổng hợp DKDTP V2 <span style="color:#ef4444">*</span>
        </label>
        <div class="file-upload-wrapper">
            <input type="file" id="upload" accept=".xlsx, .xls">
            <div class="note">Chỉ chấp nhận file định dạng .xlsx hoặc .xls</div>
        </div>
    </div>

    <button onclick="processFile()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:24px;height:24px;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75l3 3m0 0l3-3m-3 3v-7.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        Xử lý & Tải xuống
    </button>
    <div id="status"></div>
</div>

<script>
    // --- TỰ ĐỘNG SET GIỜ MẶC ĐỊNH (16:00) ---
    window.onload = function() {
        const now = new Date();
        const tomorrow = new Date(now);
        tomorrow.setDate(tomorrow.getDate() + 1);

        function formatInputDate(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}T16:00`;
        }

        document.getElementById('dateIn').value = formatInputDate(now);
        document.getElementById('dateOut').value = formatInputDate(tomorrow);
    };
    // ----------------------------------------

    function formatDateTimeVN(dateTimeString) {
        if (!dateTimeString) return "";
        const dateObj = new Date(dateTimeString);
        const day = String(dateObj.getDate()).padStart(2, '0');
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const year = dateObj.getFullYear();
        const hours = String(dateObj.getHours()).padStart(2, '0');
        const minutes = String(dateObj.getMinutes()).padStart(2, '0');
        const seconds = "00"; 
        return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
    }

    function processFile() {
        const fileInput = document.getElementById('upload');
        const dateInInput = document.getElementById('dateIn').value;
        const dateOutInput = document.getElementById('dateOut').value;
        const status = document.getElementById('status');

        if (!fileInput.files.length) {
            alert("Vui lòng chọn file Excel!");
            return;
        }
        if (!dateInInput) {
            alert("Vui lòng chọn Thời gian vào!");
            return;
        }

        status.style.display = "block";
        status.style.color = "#1d4ed8";
        status.style.backgroundColor = "#eff6ff";
        status.style.border = "1px solid #bfdbfe";
        status.innerText = "⏳ Đang xử lý dữ liệu...";

        const reader = new FileReader();
        
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {defval: ""});
                const formattedDateIn = formatDateTimeVN(dateInInput);
                const formattedDateOut = formatDateTimeVN(dateOutInput);

                const newData = jsonData.map((row, index) => {
                    let loaiGiayTo = "";
                    let tenGiayTo = ""; 
                    let soGiayTo = "";

                    // --- LOGIC XỬ LÝ GIẤY TỜ ---
                    if (row['CMND/ CCCD/ Số định danh (*)']) {
                        loaiGiayTo = "CCCD"; 
                        tenGiayTo = "Căn cước công dân";
                        soGiayTo = row['CMND/ CCCD/ Số định danh (*)'];
                    } else if (row['Số hộ chiếu (*)']) {
                        loaiGiayTo = "Hộ chiếu";
                        tenGiayTo = "Hộ chiếu";
                        soGiayTo = row['Số hộ chiếu (*)'];
                    } else if (row['Giấy tờ khác (*)']) {
                        loaiGiayTo = "Giấy tờ khác"; 
                        tenGiayTo = "Thẻ BHYT";
                        soGiayTo = row['Giấy tờ khác (*)'];
                    } else if (row['Số điện thoại']) {
                        loaiGiayTo = "Giấy tờ khác";
                        tenGiayTo = "Số điện thoại";
                        soGiayTo = row['Số điện thoại'];
                    }
                    // --------------------------------

                    let diaChiChiTiet = "";
                    const soNha = row['Địa chỉ – Số nhà'] || "";
                    const phuongXa = row['Địa chỉ – Phường xã'] || "";
                    const tinhThanh = row['Địa chỉ – Tỉnh thành'] || "";
                    
                    let parts = [];
                    if(soNha) parts.push(soNha);
                    if(phuongXa) parts.push(phuongXa);
                    if(tinhThanh) parts.push(tinhThanh);
                    diaChiChiTiet = parts.join(", "); 

                    return {
                        "STT": row['STT'] || (index + 1),
                        "Họ và tên (*)": row['Họ và tên (*)'],
                        "Ngày, tháng, năm sinh (*)": row['Ngày, tháng, năm sinh (*)'],
                        "Giới tính (*)": row['Giới tính (*)'],
                        "Quốc gia (*)": row['Địa chỉ – Quốc gia (*)'] || "Việt Nam",
                        "Quốc tịch (*)": row['Quốc tịch (*)'],
                        "Loại giấy tờ (*)": loaiGiayTo,
                        "Tên giấy tờ (*)": tenGiayTo,
                        "Số giấy tờ (*)": soGiayTo,
                        "Số điện thoại": row['Số điện thoại'],
                        "Loại cư trú (*)": "Tạm trú",
                        "Tỉnh/TP (*)": row['Địa chỉ – Tỉnh thành'],
                        "Quận/Huyện_cũ (*)": "", 
                        "Phường/Xã/ Đặc khu (*)": row['Địa chỉ – Phường xã'],
                        "Địa chỉ chi tiết (*)": diaChiChiTiet, 
                        "Thời gian lưu trú (từ ngày) (*)": formattedDateIn, 
                        "Thời gian lưu trú (đến ngày)": formattedDateOut, 
                        "Lý do lưu trú (*)": "Khám chữa bệnh",
                        "Tên phòng / Khoa (*)": row['Số phòng']
                    };
                });

                const newWorksheet = XLSX.utils.json_to_sheet(newData);
                const newWorkbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, "Data_Moi");

                XLSX.writeFile(newWorkbook, "Danh_sach_KCB_Tamtru.xlsx");
                
                status.style.color = "#155724";
                status.style.backgroundColor = "#d4edda";
                status.style.border = "1px solid #c3e6cb";
                status.innerText = "✅ Xử lý thành công! Đang tải xuống.";
            } catch (error) {
                console.error(error);
                status.style.color = "#721c24";
                status.style.backgroundColor = "#f8d7da";
                status.style.border = "1px solid #f5c6cb";
                status.innerText = "❌ Có lỗi xảy ra. Vui lòng kiểm tra lại file Excel.";
            }
        };

        reader.readAsArrayBuffer(fileInput.files[0]);
    }
</script>

</body>
</html>
