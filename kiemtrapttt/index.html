<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra PTTT - Chi Tiết Toàn Bộ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f4f6f9; font-size: 12.5px; } /* Giảm font nhẹ để vừa bảng */
        .table-responsive { max-height: 80vh; overflow-y: auto; border: 1px solid #dee2e6; }
        thead th { position: sticky; top: 0; background-color: #0d6efd; color: white; z-index: 10; white-space: nowrap; }
        td { vertical-align: middle; }
        
        /* Màu sắc trạng thái */
        .status-ok { background-color: #d1e7dd; color: #0f5132; }
        .status-error { background-color: #f8d7da; color: #842029; font-weight: bold; }
        .status-warning { background-color: #fff3cd; color: #664d03; }
        .status-unknown { background-color: #e2e3e5; color: #41464b; }
        
        .info-col { font-size: 0.9em; color: #555; }
    </style>
</head>
<body>

<div class="container-fluid py-3">
    <div class="card shadow-sm mb-3">
        <div class="card-body py-2 d-flex justify-content-between align-items-center">
            <h4 class="m-0 text-primary"><i class="bi bi-table"></i> ĐỐI CHIẾU DỮ LIỆU PTTT</h4>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary btn-sm" onclick="loadConfig()">
                    <i class="bi bi-arrow-repeat"></i> Tải lại Cấu hình
                </button>
                <input type="file" id="uploadFile" class="form-control form-control-sm" style="width: 250px;" accept=".xlsx, .xls" />
                <button class="btn btn-success btn-sm" onclick="processData()">
                    <i class="bi bi-play-circle"></i> KIỂM TRA
                </button>
            </div>
        </div>
    </div>

    <div id="statsBar" class="alert alert-light border d-flex justify-content-around py-2 mb-3 d-none">
        <span>Tổng số ca: <b id="totalCount">0</b></span>
        <span class="text-success">Hợp lệ: <b id="validCount">0</b></span>
        <span class="text-danger">Lỗi nghiêm trọng: <b id="errorCount">0</b></span>
        <span class="text-warning">Cảnh báo thời gian: <b id="warningCount">0</b></span>
    </div>

    <div class="table-responsive bg-white shadow-sm">
        <table class="table table-bordered table-hover mb-0" id="mainTable">
            <thead>
                <tr>
                    <th width="40">STT</th>
                    <th>Ngày PTTT</th>
                    <th>Mã HS</th>
                    <th>Bệnh nhân</th>
                    <th>Ngày sinh</th>
                    <th>Vào/Ra Viện</th>
                    <th>Dịch vụ (DVKT)</th>
                    <th>KTV thực hiện</th>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>Phút</th>
                    <th>Trạng thái & Lỗi</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="12" class="text-center py-5 text-muted">Vui lòng chọn file Excel để xem chi tiết.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let currentConfig = {};
    const DEFAULT_RULE = { allowOverlap: false, minTime: 5, maxTime: 120 };

    window.onload = loadConfig;

    async function loadConfig() {
        try {
            const response = await fetch('./danhmucdvkt.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error("404");
            currentConfig = await response.json();
            console.log("Cấu hình đã tải:", currentConfig);
        } catch (e) {
            alert("⚠️ Không tải được file cấu hình. Đang dùng chế độ mặc định.");
            currentConfig = { "default": DEFAULT_RULE };
        }
    }

    function normalizeName(str) {
        if (!str) return "";
        return str.toString().toLowerCase().trim().replace(/\s+/g, ' ');
    }

    function processData() {
        const fileInput = document.getElementById('uploadFile');
        if (!fileInput.files.length) { alert("Chưa chọn file!"); return; }

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];

            // Tự động tìm dòng tiêu đề
            const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            let headerRowIndex = 0;
            
            for(let i = 0; i < rawData.length; i++) {
                const rowStr = JSON.stringify(rawData[i]);
                if(rowStr.includes("Tên bệnh nhân") && rowStr.includes("PTV/TTV chính")) {
                    headerRowIndex = i;
                    break;
                }
            }

            const jsonData = XLSX.utils.sheet_to_json(sheet, { 
                range: headerRowIndex, 
                defval: "" 
            });
            
            analyzeAndRender(jsonData);
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
    }

    function analyzeAndRender(data) {
        const tableBody = document.querySelector('#mainTable tbody');
        tableBody.innerHTML = '';
        
        let stats = { total: 0, valid: 0, error: 0, warning: 0 };
        const staffMap = {}; 
        
        const configMap = {};
        for (let key in currentConfig) configMap[normalizeName(key)] = currentConfig[key];

        // --- BƯỚC 1: XỬ LÝ DỮ LIỆU ---
        const processedRows = data.map((row, index) => {
            const result = {
                id: index + 1,
                rowExcel: index + 2,
                // Các trường dữ liệu mới
                maHoSo: (row['Mã hồ sơ'] || "").toString().trim(),
                ngaySinh: (row['Ngày sinh'] || "").toString().trim(),
                ngayVao: (row['Ngày vào viện'] || "").toString().trim(),
                ngayRa: (row['Ngày ra viện'] || "").toString().trim(),
                
                patient: (row['Tên bệnh nhân'] || "").toString().trim(),
                service: (row['Phương pháp PTTT'] || "").toString().trim(),
                staff: (row['PTV/TTV chính'] || "").toString().trim(),
                dateIn: (row['Ngày PTTT'] || "").toString().trim(),
                timeIn: row['Giờ PTTT'],
                dateOut: (row['Ngày KTPTTT'] || "").toString().trim(),
                timeOut: row['Giờ KTPTTT'],
                duration: 0,
                status: "OK", 
                messages: []
            };

            if (!result.staff || !result.service) return null;

            // 1. Check ngày PTTT
            if (result.dateIn !== result.dateOut) {
                result.status = "ERROR";
                result.messages.push(`Sai ngày (Vào: ${result.dateIn}, Ra: ${result.dateOut})`);
            }

            // 2. Tính thời gian
            const startObj = combineDateTime(result.dateIn, result.timeIn);
            const endObj = combineDateTime(result.dateOut, result.timeOut);
            
            result.startObj = startObj;
            result.endObj = endObj;

            if (startObj && endObj) {
                let minutes = (endObj - startObj) / 60000;
                result.duration = Math.round(minutes * 100) / 100;
                
                if (result.duration <= 0) {
                    result.status = "ERROR";
                    result.messages.push("Thời gian lỗi (<= 0)");
                }
            } else {
                result.status = "ERROR";
                result.messages.push("Lỗi định dạng giờ");
            }

            // 3. Check Min/Max
            const normService = normalizeName(result.service);
            let rule = configMap[normService];
            
            if (!rule) {
                result.status = result.status === "ERROR" ? "ERROR" : "UNKNOWN";
                result.messages.push("Chưa cấu hình");
                rule = { ...DEFAULT_RULE, isDefault: true };
            } else {
                if (result.duration < rule.minTime || (rule.maxTime > 0 && result.duration > rule.maxTime)) {
                    if (result.status !== "ERROR") result.status = "WARNING";
                    result.messages.push(`Lỗi thời gian (QĐ: ${rule.minTime}-${rule.maxTime})`);
                }
            }
            result.rule = rule;

            if (!staffMap[result.staff]) staffMap[result.staff] = [];
            staffMap[result.staff].push(result);

            return result;
        }).filter(item => item !== null);

        // --- BƯỚC 2: CHECK TRÙNG LẶP NÂNG CAO ---
        for (const staff in staffMap) {
            const sessions = staffMap[staff];
            sessions.sort((a, b) => (a.startObj || 0) - (b.startObj || 0));

            for (let i = 0; i < sessions.length; i++) {
                for (let j = i + 1; j < sessions.length; j++) {
                    const ca1 = sessions[i];
                    const ca2 = sessions[j];

                    // Nếu ca sau bắt đầu sau khi ca trước kết thúc -> Hết trùng
                    if (!ca2.startObj || !ca1.endObj || ca2.startObj >= ca1.endObj) break;

                    // --- LOGIC MỚI: KIỂM TRA TRÙNG KHỚP HOÀN TOÀN ---
                    const isExactMatch = (ca1.startObj.getTime() === ca2.startObj.getTime()) && 
                                         (ca1.endObj.getTime() === ca2.endObj.getTime());

                    // Check luật allowOverlap từ JSON
                    const isConfigAllowed = !ca1.rule.isDefault && !ca2.rule.isDefault && 
                                            ca1.rule.allowOverlap && ca2.rule.allowOverlap;

                    if (ca1.patient !== ca2.patient) {
                        let isViolation = false;
                        let msg = "";

                        if (isExactMatch) {
                            // Trường hợp 1: Trùng khớp 100% thời gian -> LUÔN LUÔN LỖI (Bất kể cấu hình)
                            isViolation = true;
                            msg = `⛔ Trùng 100% thời gian với ${ca2.patient} (Không được phép)`;
                        } else if (!isConfigAllowed) {
                            // Trường hợp 2: Có overlap nhưng không được cấu hình cho phép
                            isViolation = true;
                            msg = `⛔ Trùng giờ với ${ca2.patient} (DVKT không cho phép gối đầu)`;
                        }

                        if (isViolation) {
                            ca1.status = "ERROR";
                            ca1.messages.push(msg.replace(ca2.patient, ca2.patient)); // Hack để dùng chuỗi msg linh động
                            
                            ca2.status = "ERROR";
                            ca2.messages.push(msg.replace(ca2.patient, ca1.patient));
                        }
                    }
                }
            }
        }

        // --- BƯỚC 3: HIỂN THỊ ---
        stats.total = processedRows.length;

        processedRows.forEach(row => {
            let rowClass = "";
            let statusBadge = "";

            if (row.status === "OK") {
                rowClass = "status-ok";
                statusBadge = `<span class="badge bg-success">Hợp lệ</span>`;
                stats.valid++;
            } else if (row.status === "ERROR") {
                rowClass = "status-error";
                statusBadge = `<span class="badge bg-danger">Lỗi</span>`;
                stats.error++;
            } else if (row.status === "WARNING") {
                rowClass = "status-warning";
                statusBadge = `<span class="badge bg-warning text-dark">Cảnh báo</span>`;
                stats.warning++;
            } else {
                rowClass = "status-unknown";
                statusBadge = `<span class="badge bg-secondary">Chưa rõ</span>`;
            }

            const tr = document.createElement('tr');
            tr.className = rowClass;
            tr.innerHTML = `
                <td class="text-center">${row.id}</td>
                <td>${row.dateIn}</td>
                
                <td class="info-col">${row.maHoSo}</td>
                <td class="fw-bold">${row.patient}</td>
                <td class="info-col">${row.ngaySinh}</td>
                <td class="info-col small">
                    Vào: ${row.ngayVao}<br>
                    Ra: ${row.ngayRa}
                </td>
                
                <td>${row.service}</td>
                <td>${row.staff}</td>
                <td class="text-center">${formatSimpleTime(row.startObj)}</td>
                <td class="text-center">${formatSimpleTime(row.endObj)}</td>
                <td class="text-center fw-bold text-primary">${row.duration}'</td>
                <td>
                    ${statusBadge}
                    <div class="small mt-1 text-danger">${row.messages.join('<br>')}</div>
                </td>
            `;
            tableBody.appendChild(tr);
        });

        document.getElementById('statsBar').classList.remove('d-none');
        document.getElementById('totalCount').innerText = stats.total;
        document.getElementById('validCount').innerText = stats.valid;
        document.getElementById('errorCount').innerText = stats.error;
        document.getElementById('warningCount').innerText = stats.warning;
    }

    // --- UTILS ---
    function combineDateTime(dateStr, timeVal) {
        if (!dateStr) return null;
        let d = new Date();
        const parts = dateStr.split('/');
        if (parts.length === 3) d = new Date(parts[2], parts[1] - 1, parts[0]);
        
        if (typeof timeVal === 'number') {
            d.setSeconds(d.getSeconds() + Math.round(timeVal * 86400));
        } else if (typeof timeVal === 'string') {
            const t = timeVal.split(':');
            if (t.length >= 2) d.setHours(t[0], t[1], 0);
        }
        return d;
    }

    function formatSimpleTime(dateObj) {
        if (!dateObj) return "-";
        return dateObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
    }
</script>

</body>
</html>
