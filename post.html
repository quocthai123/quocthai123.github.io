<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang tải bài viết...</title> 
    <link rel="icon" type="image/jpeg" href="/path/to/your/avatar.jpg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <style>
        /* === GIỮ NGUYÊN TOÀN BỘ CSS TỪ TRANG CŨ === */
        :root {
            --primary-color: #00bcd4;
            --secondary-color: #0097a7;
            --accent-color: #00eaff;
            --dark-bg: #1a1a2e;
            --darker-bg: #0f0f1e;
            --light-text: #e0e0e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--light-text);
            line-height: 1.6;
            overflow-x: hidden;
            background: var(--darker-bg);
        }
        .navbar {
            background: rgba(26, 26, 46, 0.95) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 188, 212, 0.1);
            padding: 15px 0;
            transition: all 0.3s ease;
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color) !important;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-brand img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .nav-link {
            color: var(--light-text) !important;
            font-weight: 500;
            margin: 0 10px;
            transition: color 0.3s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--accent-color) !important;
        }
        footer {
            background: var(--darker-bg);
            padding: 30px 0;
            text-align: center;
            border-top: 1px solid rgba(0, 234, 255, 0.2);
        }

        /* === CSS MỚI CHO TRANG BÀI VIẾT === */
        .post-header {
            padding: 150px 0 80px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            text-align: center;
            color: #fff;
        }
        .post-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.9), rgba(0, 188, 212, 0.7));
        }
        .post-header-content {
            position: relative;
            z-index: 2;
        }
        .post-header .post-category {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .post-header .post-title {
            font-size: 3rem;
            font-weight: 700;
            max-width: 800px;
            margin: 0 auto 20px;
        }
        .post-header .post-meta {
            font-size: 1rem;
            color: #eee;
        }

        .post-content-section {
            padding: 80px 0;
            background-color: var(--dark-bg);
        }
        .post-body {
            max-width: 800px;
            margin: 0 auto;
            color: var(--light-text);
            line-height: 1.8;
            font-size: 1.1rem;
        }
        .post-body h1, .post-body h2, .post-body h3 {
            color: var(--accent-color);
            margin-top: 40px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .post-body p {
            margin-bottom: 20px;
        }
        .post-body img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .post-body a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 2px solid var(--secondary-color);
            transition: all 0.3s ease;
        }
        .post-body a:hover {
            color: #fff;
            background-color: var(--secondary-color);
            border-bottom-color: var(--accent-color);
        }
         .post-body blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 20px;
            margin: 30px 0;
            font-style: italic;
            color: #ccc;
        }
        .post-body ul, .post-body ol {
            padding-left: 30px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"> <img src="img/avtar.jpg" alt="Avatar Lê Quốc Thái"> Lê Quốc Thái
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li> <li class="nav-item"><a class="nav-link active" href="index.html">Blog</a></li> <li class="nav-item"><a class="nav-link" href="https://checkxml.lqt.id.vn" target="_blank">LQT SureCheck</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#contact">Liên hệ</a></li> </ul>
            </div>
        </div>
    </nav>

    <header id="post-header" class="post-header">
        <div class="container post-header-content" data-aos="fade-in">
             <div id="post-meta-container">
                </div>
        </div>
    </header>

    <main class="post-content-section">
        <div class="container">
            <div id="post-content" class="post-body">
                </div>
        </div>
    </main>

    <footer id="contact">
        <div class="container">
            <p class="mb-2">© 2025 Lê Quốc Thái - Blog cá nhân</p>
            <p class="mb-0">Kết nối với tôi qua <a href="mailto:lethaicaolanh2@gmail.com" style="color: var(--accent-color);">lethaicaolanh2@gmail.com</a></p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true,
        });

        document.addEventListener('DOMContentLoaded', function() {
            // Danh sách bài viết (bạn nên giữ nó đồng bộ với trang chủ)
            const allPosts = [
                {
                    title: 'LQT SureCheck: Hành Trình Tạo Ra Công Cụ Miễn Phí Cho Cộng Đồng Y Tế',
                    excerpt: 'Từ ý tưởng ban đầu đến khi triển khai cho hơn 150 cơ sở, đây là câu chuyện đằng sau dự án LQT SureCheck và những bài học kinh nghiệm.',
                    image: 'https://images.unsplash.com/photo-1599423300746-b625ed8ba949?q=80&w=1887&auto=format&fit=crop',
                    category: 'Dự Án',
                    date: '13/10/2025',
                    fileName: 'lqt-surecheck-story' 
                },
                {
                     title: 'Đám Cưới Của Tôi: Những Khoảnh Khắc Đáng Nhớ',
                    excerpt: 'Một chút chia sẻ về ngày trọng đại của cuộc đời mình. Album ảnh cưới và những câu chuyện chưa kể.',
                    image: 'https://images.unsplash.com/photo-1523438943997-861c85025754?q=80&w=2070&auto=format&fit=crop',
                    category: 'Đời Sống',
                    date: '10/10/2025',
                    fileName: 'ourweddingday'
                },
                {
                    title: 'Tối Ưu Hóa Website Tĩnh: Tại Sao Mình Chọn Jamstack?',
                    excerpt: 'Khám phá lý do tại sao các trang web tĩnh đang trở lại mạnh mẽ. Mình sẽ chia sẻ cách xây dựng blog này mà không cần cơ sở dữ liệu.',
                    image: 'https://images.unsplash.com/photo-1618773928121-c32242e63f39?q=80&w=2070&auto=format&fit=crop',
                    category: 'Kỹ Thuật',
                    date: '05/10/2025',
                    fileName: 'why-jamstack'
                },
            ];

            const postContentContainer = document.getElementById('post-content');
            const postMetaContainer = document.getElementById('post-meta-container');
            const postHeader = document.getElementById('post-header');

            // Lấy `fileName` từ URL, ví dụ: post.html?name=our-wedding-day
            const urlParams = new URLSearchParams(window.location.search);
            const postFileName = urlParams.get('name');

            // Tìm thông tin bài viết trong mảng allPosts
            const postData = allPosts.find(p => p.fileName === postFileName);

            if (postData) {
                // Cập nhật tiêu đề trang và header
                document.title = postData.title + " - Lê Quốc Thái Blog";
                postHeader.style.backgroundImage = `url('${postData.image}')`;
                
                // Hiển thị thông tin bài viết (tiêu đề, ngày đăng,...)
                postMetaContainer.innerHTML = `
                    <span class="post-category">${postData.category}</span>
                    <h1 class="post-title">${postData.title}</h1>
                    <div class="post-meta">
                        <i class="fas fa-calendar-alt"></i> ${postData.date}
                    </div>
                `;

                // Tải và hiển thị nội dung từ file .md
                fetch(`posts/${postFileName}.md`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Không tìm thấy file bài viết.');
                        }
                        return response.text();
                    })
                    .then(markdown => {
                        const converter = new showdown.Converter();
                        const html = converter.makeHtml(markdown);
                        postContentContainer.innerHTML = html;
                    })
                    .catch(error => {
                        console.error('Lỗi:', error);
                        postContentContainer.innerHTML = `<p style="text-align: center;">Rất tiếc, không thể tải được nội dung bài viết. Vui lòng thử lại sau.</p>`;
                    });
            } else {
                // Xử lý trường hợp không tìm thấy bài viết
                document.title = "Không Tìm Thấy Bài Viết - Lê Quốc Thái Blog";
                postContentContainer.innerHTML = `<p style="text-align: center;">Bài viết bạn tìm kiếm không tồn tại.</p>`;
            }
        });
    </script>
</body>
</html>
