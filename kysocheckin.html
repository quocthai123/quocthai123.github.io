<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Quản lý & Ký số XML BHYT</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f5f7fa; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        
        /* Giao diện chọn file */
        .file-upload { border: 2px dashed #3498db; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; }
        .file-upload:hover { background-color: #ebf5fb; }
        
        /* Bảng dữ liệu */
        .table-container { overflow-x: auto; margin-top: 20px; max-height: 400px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #2c3e50; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f4f6; }
        
        /* Trạng thái */
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .pending { background: #ffeaa7; color: #d63031; }
        .signed { background: #55efc4; color: #00b894; }

        .btn-group { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-sign { background-color: #27ae60; color: white; }
        .btn-sign:hover { background-color: #219150; }
        .btn-download { background-color: #3498db; color: white; }
        .btn-clear { background-color: #e74c3c; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Quản Lý Danh Sách Khám Chữa Bệnh (XML)</h2>
    
    <div class="file-upload" onclick="document.getElementById('fileInput').click()">
        <strong>Nhấn vào đây để chọn nhiều file XML</strong>
        <input type="file" id="fileInput" accept=".xml" multiple style="display: none">
        <p id="fileCount" style="color: #7f8c8d;"></p>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã LK</th>
                    <th>Họ Tên</th>
                    <th>Mã Thẻ BHYT</th>
                    <th>Ngày Vào</th>
                    <th>Tên Dịch Vụ</th>
                    <th>Trạng Thái</th>
                </tr>
            </thead>
            <tbody id="patientTableBody">
                </tbody>
        </table>
    </div>

    <div class="btn-group">
        <button class="btn-sign" onclick="signAllFiles()">Ký Số Hàng Loạt</button>
        <button class="btn-download" onclick="downloadAll()">Tải Tất Cả File Đã Ký</button>
        <button class="btn-clear" onclick="clearData()">Xóa Danh Sách</button>
    </div>
</div>

<script>
    let listFilesData = []; // Lưu trữ mảng các đối tượng { fileName: '', xmlDoc: XMLDocument, signed: false }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const files = e.target.files;
        if (files.length === 0) return;

        document.getElementById('fileCount').innerText = `Đã chọn ${files.length} file.`;

        Array.from(files).forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(event.target.result, "text/xml");
                
                // Lưu vào danh sách xử lý
                listFilesData.push({
                    fileName: file.name,
                    xmlDoc: xmlDoc,
                    signed: false
                });

                // Cập nhật bảng ngay sau khi đọc xong mỗi file
                renderTable();
            };
            reader.readAsText(file);
        });
    });

    function renderTable() {
        const tbody = document.getElementById('patientTableBody');
        tbody.innerHTML = "";

        listFilesData.forEach((item, index) => {
            const xml = item.xmlDoc;
            const row = tbody.insertRow();
            
            // Trích xuất thông tin từ các thẻ XML
            const maLk = xml.getElementsByTagName("MA_LK")[0]?.textContent || "N/A";
            const hoTen = xml.getElementsByTagName("HO_TEN")[0]?.textContent || "N/A";
            const bhyt = xml.getElementsByTagName("MA_THE_BHYT")[0]?.textContent || "N/A";
            const ngayVao = xml.getElementsByTagName("NGAY_VAO")[0]?.textContent || "N/A";
            const tenDV = xml.getElementsByTagName("TEN_DICH_VU")[0]?.textContent || "N/A";
            
            const statusClass = item.signed ? "signed" : "pending";
            const statusText = item.signed ? "Đã ký" : "Chờ ký";

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${maLk}</td>
                <td>${hoTen}</td>
                <td>${bhyt}</td>
                <td>${ngayVao}</td>
                <td>${tenDV}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            `;
        });
    }

    function signAllFiles() {

        </X509Data>
    </KeyInfo>
    <Object>
        <SignatureProperties>
            <SignatureProperty Target="#${signatureId}">
                <SigningTime>${now}</SigningTime>

    </Object>
</Signature>`;

            chuKyNode.innerHTML = sigTemplate;
            item.signed = true;
        });

        renderTable();
        alert("Đã ký số thành công cho " + listFilesData.length + " file!");
    }

    function downloadAll() {
        if (listFilesData.length === 0) return;
        
        listFilesData.forEach(item => {
            const serializer = new XMLSerializer();
            const xmlContent = serializer.serializeToString(item.xmlDoc);
            const blob = new Blob([xmlContent], {type: "text/xml"});
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = "Signed_" + item.fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    }

    function clearData() {
        listFilesData = [];
        document.getElementById('fileCount').innerText = "";
        document.getElementById('fileInput').value = "";
        renderTable();
    }
</script>

</body>
</html>
