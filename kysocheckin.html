<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Ký số XML BHYT - Chuẩn SHA256</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; color: #2c3e50; border-bottom: 3px solid #3498db; margin-bottom: 25px; padding-bottom: 10px; }
        .drop-zone { border: 2px dashed #3498db; padding: 30px; text-align: center; color: #3498db; cursor: pointer; border-radius: 8px; margin-bottom: 20px; background: #f0f8ff; transition: 0.3s; }
        .drop-zone:hover { background: #e1effe; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; font-size: 13px; }
        th { background-color: #2c3e50; color: white; }
        .status-badge { padding: 5px 10px; border-radius: 15px; font-weight: bold; font-size: 11px; }
        .bg-pending { background: #f1c40f; color: #000; }
        .bg-success { background: #2ecc71; color: #fff; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
        button { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-sign { background-color: #e67e22; color: white; }
        .btn-download { background-color: #3498db; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>KÝ SỐ CHI TIÊU TRẠNG THÁI KCB</h2>
        <p>Chuẩn ký: SHA256 | Target: CHI_TIEU_TRANG_THAI_KCB -> DSACH_TRANG_THAI_KCB</p>
    </div>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <strong>Kéo thả hoặc Click để chọn file XML cần ký</strong>
        <input type="file" id="fileInput" accept=".xml" multiple style="display: none">
    </div>

    <table id="dataTable">
        <thead>
            <tr>
                <th>STT</th>
                <th>Mã LK</th>
                <th>Họ Tên</th>
                <th>Mã Thẻ BHYT</th>
                <th>Ngày Vào</th>
                <th>Trạng Thái</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="controls">
        <button class="btn-sign" onclick="signFiles()">THỰC HIỆN KÝ SỐ (SHA256)</button>
        <button class="btn-download" onclick="downloadAll()">TẢI FILE ĐÃ KÝ</button>
    </div>
</div>

<script>
    let xmlFiles = [];

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const files = e.target.files;
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(event.target.result, "text/xml");
                xmlFiles.push({ name: file.name, doc: xmlDoc, signed: false });
                renderTable();
            };
            reader.readAsText(file);
        });
    });

    function renderTable() {
        const tbody = document.querySelector("#dataTable tbody");
        tbody.innerHTML = "";
        xmlFiles.forEach((item, index) => {
            // Lấy dữ liệu từ bản ghi đầu tiên trong danh sách
            const firstRecord = item.doc.getElementsByTagName("TRANG_THAI_KCB")[0];
            const row = `<tr>
                <td>${index + 1}</td>
                <td>${firstRecord?.querySelector("MA_LK")?.textContent || "N/A"}</td>
                <td>${firstRecord?.querySelector("HO_TEN")?.textContent || "N/A"}</td>
                <td>${firstRecord?.querySelector("MA_THE_BHYT")?.textContent || "N/A"}</td>
                <td>${firstRecord?.querySelector("NGAY_VAO")?.textContent || "N/A"}</td>
                <td><span class="status-badge ${item.signed ? 'bg-success' : 'bg-pending'}">
                    ${item.signed ? 'ĐÃ KÝ' : 'CHỜ KÝ'}
                </span></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    async function signFiles() {
        if (xmlFiles.length === 0) return alert("Vui lòng chọn file!");

            // 1. Tạo Node CHUKYDONVI nếu chưa có
            let chuKyNode = doc.getElementsByTagName("CHUKYDONVI")[0];

                doc.documentElement.appendChild(chuKyNode);
            }

            // 2. Logic lấy vùng dữ liệu cần ký (Từ đầu đến hết DSACH_TRANG_THAI_KCB)
            // Trong thực tế code C# của bạn dùng partialDoc để ký, ở đây ta mô phỏng:

        <Reference URI="#${objId}">

        <X509Data>

            <X509SubjectName>UID=MST:1400524306,CN=Bệnh Viện Phục Hồi Chức Năng,L=Phường Cao Lãnh,ST=Đồng Tháp,C=VN</X509SubjectName>
        </X509Data>
    </KeyInfo>
    <Object Id="${objId}">
        <SignatureProperties>

        </SignatureProperties>
    </Object>
</Signature>`;

            // Chèn vào node CHUKYDONVI
            const sigDoc = new DOMParser().parseFromString(signatureTemplate, "text/xml");
            chuKyNode.innerHTML = ""; 
            chuKyNode.appendChild(doc.importNode(sigDoc.documentElement, true));
            
            item.signed = true;
        }
        renderTable();
        alert("Ký thành công " + xmlFiles.length + " file!");
    }

    function downloadAll() {
        xmlFiles.forEach(item => {
            if (!item.signed) return;
            const serializer = new XMLSerializer();
            const content = '<?xml version="1.0" encoding="utf-8"?>\n' + serializer.serializeToString(item.doc);
            const blob = new Blob([content], {type: "text/xml"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "SIGNED_" + item.name;
            a.click();
        });
    }
</script>

</body>
</html>
